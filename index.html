<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Codex de la Porte de Baldur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2eff6; --surface:#ffffff; --surface2:#e9e4f0; --ink:#231b31; --muted:#62577a; --line:#d4cce0;
  --accent:#6a45cf; --accent-ink:#ffffff; --accent-soft:#e6defb; --gold:#93700f; --danger:#b23b33; --ok:#2e7a55;
  --r-commune:#6f6a78; --r-inhabituelle:#2f8f46; --r-rare:#2f6fc4; --r-tres-rare:#8a3fd1; --r-legendaire:#b97d0c; --r-histoire:#b04a7a;
  --figure:#cfc6db; --empty:#f1edf6;
  --serif:"Alegreya", Georgia, "Times New Roman", serif;
  --sans:"Alegreya Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16131d; --surface:#1f1a29; --surface2:#2a2336; --ink:#ebe5f4; --muted:#a59bb8; --line:#3a3149;
    --accent:#a98bff; --accent-ink:#16131d; --accent-soft:#30264a; --gold:#e1bb5c; --danger:#ec7a70; --ok:#6fcf9e;
    --r-commune:#a8a2b3; --r-inhabituelle:#5fcf7a; --r-rare:#63a4f5; --r-tres-rare:#b98af0; --r-legendaire:#f0b43c; --r-histoire:#e07aa8;
    --figure:#3f3651; --empty:#241e2f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16131d; --surface:#1f1a29; --surface2:#2a2336; --ink:#ebe5f4; --muted:#a59bb8; --line:#3a3149;
  --accent:#a98bff; --accent-ink:#16131d; --accent-soft:#30264a; --gold:#e1bb5c; --danger:#ec7a70; --ok:#6fcf9e;
  --r-commune:#a8a2b3; --r-inhabituelle:#5fcf7a; --r-rare:#63a4f5; --r-tres-rare:#b98af0; --r-legendaire:#f0b43c; --r-histoire:#e07aa8;
  --figure:#3f3651; --empty:#241e2f;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 16px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.15;margin:0 0 .5em}
h2{font-size:1.45rem} h3{font-size:1.12rem}
p{margin:.3em 0 .8em}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:.38em .55em;max-width:100%}
textarea{width:100%;min-height:9em;resize:vertical;line-height:1.5}
input[type=number]{width:5.2em}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:1.05em;height:1.05em;margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn,button{background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:.38em .8em;cursor:pointer;white-space:nowrap}
.btn:hover,button:hover{border-color:var(--accent)}
.btn.primary,button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent}
button.danger{color:var(--danger)}
button.small{padding:.15em .5em;font-size:.88rem}
button[disabled]{opacity:.5;cursor:not-allowed}
.muted{color:var(--muted)} .small{font-size:.88rem}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.stack>*+*{margin-top:.6rem}
.hidden{display:none!important}

/* header */
.top-unused{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:1rem;padding:.5rem 1rem;max-width:1600px;margin:0 auto}
.brand{display:flex;align-items:center;gap:.5rem;text-decoration:none;color:var(--ink);font-family:var(--serif);font-weight:700;font-size:1.12rem;white-space:nowrap}
.brand svg{width:28px;height:28px;color:var(--gold);flex:none}
.tabs{display:flex;gap:.15rem;overflow-x:auto;flex:1;scrollbar-width:thin}
.tabs a{padding:.55rem .85rem;text-decoration:none;color:var(--muted);border-radius:8px 8px 0 0;white-space:nowrap;border-bottom:3px solid transparent;font-weight:500}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.sync{font-size:.82rem;color:var(--muted);white-space:nowrap}
.sync::before{content:"";display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--muted);margin-right:.4em;vertical-align:middle}
.sync.ok::before{background:var(--ok)} .sync.err::before{background:var(--danger)}
@media (max-width:760px){ .brand span{display:none} .sync{display:none} .bar{gap:.5rem;padding:.4rem .6rem} }

main{max-width:1600px;margin:0 auto;padding:1.2rem 1rem 3rem}
.view[hidden]{display:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem}
.panel+.panel{margin-top:1rem}
.lead{max-width:70ch;color:var(--muted)}

/* glossary */
.gfilters{display:flex;flex-wrap:wrap;gap:.5rem;align-items:end;margin-bottom:.8rem}
.gfilters label{display:flex;flex-direction:column;font-size:.82rem;color:var(--muted);gap:.15rem}
.gfilters input[type=search]{min-width:14rem}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:.5rem .7rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:.88rem;background:var(--surface2);position:sticky;top:0}
th button{background:none;border:0;padding:0;color:inherit;font-weight:inherit}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface2)}
tr:last-child td{border-bottom:0}
.iname{font-weight:500}
.iname small{display:block;color:var(--muted);font-weight:400}
.dot{display:inline-block;width:.6em;height:.6em;border-radius:50%;margin-right:.45em;vertical-align:.08em;background:var(--rc,var(--muted))}
.rar{color:var(--rc,var(--muted));font-weight:500}
.demo{font-size:.75rem;color:var(--gold);border:1px solid currentColor;border-radius:4px;padding:0 .3em;margin-left:.4em;white-space:nowrap}

/* dialog */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(680px,94vw);max-height:88vh}
dialog::backdrop{background:rgba(10,6,20,.55)}
.dlg-head{display:flex;justify-content:space-between;align-items:start;gap:1rem;padding:1rem 1.2rem .4rem;position:sticky;top:0;background:var(--surface)}
.dlg-body{padding:.2rem 1.2rem 1.2rem;overflow:auto}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:.3rem 1rem;margin:.6rem 0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.6rem}
.formgrid label,.field{display:flex;flex-direction:column;gap:.2rem;font-size:.88rem;color:var(--muted)}
.formgrid label input,.formgrid label select{color:var(--ink)}
fieldset{border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;margin:.8rem 0}
legend{padding:0 .3rem;color:var(--muted);font-size:.88rem}
.checks{display:flex;flex-wrap:wrap;gap:.4rem 1rem}
.checks label{display:flex;gap:.35rem;align-items:center;color:var(--ink);font-size:.92rem}
.pickitem{display:flex;justify-content:space-between;gap:.6rem;width:100%;text-align:left;background:var(--surface);margin:.25rem 0;padding:.5rem .7rem}

/* character */
.buildbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:1rem}
.buildbar select{font-family:var(--serif);font-size:1.1rem;font-weight:700}
.char-grid{display:grid;grid-template-columns:minmax(330px,1.15fr) minmax(290px,.85fr) minmax(310px,1fr);gap:1rem;align-items:start}
@media (max-width:1180px){.char-grid{grid-template-columns:1fr 1fr}.statscol{grid-column:1/-1}}
@media (max-width:760px){.char-grid{grid-template-columns:1fr}}
.sec{margin-bottom:1.1rem}
.sec h3{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.sec h3 .muted{font-family:var(--sans);font-weight:400;font-size:.88rem}
.classrow{display:grid;grid-template-columns:1fr 1fr 4.2em auto;gap:.35rem;margin-bottom:.35rem}
.classrow select,.classrow input{min-width:0;width:100%}
.abil{width:100%}
.abil td,.abil th{padding:.3rem .35rem;text-align:center;border-bottom:1px solid var(--line)}
.abil th{position:static;background:none}
.abil td:first-child,.abil th:first-child{text-align:left}
.abil .fin{font-weight:700;font-size:1.05rem}
.abil .mod{color:var(--muted)}
.pb{display:inline-flex;align-items:center;gap:.2rem}
.pb button{padding:0 .45em;line-height:1.5}
.pb span{min-width:1.6em;display:inline-block}
.feat{border:1px solid var(--line);border-radius:10px;padding:.5rem .6rem;margin-bottom:.4rem}
.feat .desc{font-size:.86rem;color:var(--muted);margin:.3rem 0 0}
.skills{columns:2;column-gap:1rem;font-size:.92rem}
@media (max-width:420px){.skills{columns:1}}
.skill{display:flex;align-items:center;gap:.35rem;break-inside:avoid;padding:.12rem 0}
.skill .sv{margin-left:auto;font-weight:700;min-width:2.2em;text-align:right}
.skill .ab{color:var(--muted);font-size:.78rem}

.doll svg{width:100%;max-width:340px;display:block;margin:0 auto}
.zone{cursor:pointer}
.zone .z{fill:var(--empty);stroke:var(--line);stroke-width:2;stroke-dasharray:5 4;transition:fill .25s}
.zone.on .z{fill:var(--zc);fill-opacity:.55;stroke:var(--zc);stroke-dasharray:none}
.zone:hover .z,.zone:focus-visible .z{stroke:var(--accent);stroke-width:3}
.zone:focus{outline:none}
.fig{fill:var(--figure)}
.figline{stroke:var(--figure);stroke-width:16;stroke-linecap:round;fill:none}
.dolllabel{font-size:12px;fill:var(--muted);font-family:var(--sans)}
.slotlist{list-style:none;padding:0;margin:.8rem 0 0}
.slotlist li{display:flex;gap:.5rem;align-items:baseline;padding:.3rem 0;border-bottom:1px dashed var(--line)}
.slotlist .sn{color:var(--muted);font-size:.85rem;width:8.5em;flex:none}
.slotlist button{background:none;border:0;padding:0;text-align:left;white-space:normal;color:var(--ink)}
.slotlist button.empty{color:var(--muted);font-style:italic}

.bignums{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:1rem}
.bignum{background:var(--surface2);border-radius:10px;padding:.5rem .6rem}
.bignum b{display:block;font-family:var(--serif);font-size:1.6rem;line-height:1.1}
.bignum span{font-size:.82rem;color:var(--muted)}
.saves{display:grid;grid-template-columns:repeat(6,1fr);gap:.3rem;text-align:center;margin-bottom:1rem}
.saves div{background:var(--surface2);border-radius:8px;padding:.3rem 0;font-size:.85rem}
.saves b{display:block;font-size:1.05rem}
.saves .pr{outline:2px solid var(--accent);outline-offset:-2px}
.todo{list-style:none;padding:0;margin:0}
.todo li{padding:.35rem 0 .35rem 1.5rem;position:relative;border-bottom:1px dashed var(--line)}
.todo li::before{content:"";position:absolute;left:.2rem;top:.75rem;width:.6rem;height:.6rem;border:2px solid var(--gold);border-radius:2px}
.todo li.warn::before{border-color:var(--danger);border-radius:50%}
.todo li.done{color:var(--ok)}
.todo li.done::before{background:var(--ok);border-color:var(--ok)}
.atk td{font-size:.92rem}

/* sandbox */
.sand-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:900px){.sand-grid{grid-template-columns:1fr}}
.cfg h3 input{font-family:var(--serif);font-weight:700;font-size:1.05rem;width:100%;border-color:transparent;background:transparent;padding-left:0}
.cfg h3 input:hover,.cfg h3 input:focus{border-color:var(--line)}
.cfg.A{border-top:4px solid var(--accent)} .cfg.B{border-top:4px solid var(--gold)}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:.8rem 0}
.res div{background:var(--surface2);border-radius:10px;padding:.45rem .6rem}
.res b{display:block;font-family:var(--serif);font-size:1.35rem}
.res span{font-size:.8rem;color:var(--muted)}
.chartwrap{overflow-x:auto}
.chartwrap svg{display:block;min-width:520px;width:100%;height:auto}
.legend{display:flex;gap:1rem;font-size:.88rem;flex-wrap:wrap}
.legend i{display:inline-block;width:.8em;height:.8em;border-radius:2px;margin-right:.3em;vertical-align:-.05em}
.killtab td,.killtab th{text-align:center;padding:.3rem .5rem}
.note-hint{font-size:.86rem;color:var(--muted);max-width:75ch}
details summary{cursor:pointer;color:var(--accent)}

/* maps */
.maps-grid{display:grid;grid-template-columns:200px 1fr 300px;gap:1rem;align-items:start}
@media (max-width:1100px){.maps-grid{grid-template-columns:1fr}}
.maplist{list-style:none;padding:0;margin:0 0 .6rem}
.maplist button{width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;border-radius:0;padding:.35rem .6rem}
.maplist button[aria-current="true"]{border-left-color:var(--accent);background:var(--surface2)}
.maptools{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-bottom:.5rem}
.maptools button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.mapview{position:relative;overflow:hidden;height:min(72vh,760px);border:1px solid var(--line);border-radius:12px;background:var(--surface2);touch-action:none;cursor:grab}
.mapview.adding{cursor:crosshair}
.mapinner{position:absolute;left:0;top:0;transform-origin:0 0}
.mapinner img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none;pointer-events:none}
.placeholder{width:100%;height:100%;background-color:var(--empty);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:100px 100px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:40px;font-family:var(--serif);text-align:center;padding:2em}
.mklayer{position:absolute;inset:0}
.marker{position:absolute;transform:translate(-50%,-50%) scale(var(--iz,1));transform-origin:50% 50%;background:var(--surface);border:2px solid var(--accent);border-radius:50%;width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.marker span{font-size:17px;line-height:1}
.marker.sel{border-color:var(--gold);border-width:3px}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}
.chip{border-radius:999px;padding:.2em .7em;font-size:.88rem;background:var(--surface2)}
.chip[aria-pressed="false"]{opacity:.45}
.linkchip{display:inline-flex;gap:.3rem;align-items:center;border:1px solid var(--line);border-radius:999px;padding:.1em .3em .1em .7em;margin:.15rem .2rem .15rem 0;background:var(--surface2)}
.linkchip button{border:0;background:none;padding:0 .3em}

/* carnet & pnj */
.split{display:grid;grid-template-columns:320px 1fr;gap:1rem;align-items:start}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.list{list-style:none;padding:0;margin:.5rem 0 0;max-height:68vh;overflow:auto}
.list li button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:.55rem .4rem;white-space:normal}
.list li button[aria-current="true"]{background:var(--surface2);box-shadow:inset 3px 0 var(--accent)}
.list .t{font-weight:500;display:block}
.list .s{font-size:.84rem;color:var(--muted);display:block}
.titleinput{font-family:var(--serif);font-size:1.4rem;font-weight:700;width:100%}
.empty-state{padding:2rem 1rem;text-align:center;color:var(--muted)}
.backlinks li{padding:.35rem 0;border-bottom:1px dashed var(--line)}
.kindtag{font-size:.78rem;border-radius:4px;padding:0 .35em;background:var(--accent-soft);color:var(--ink);margin-left:.4em}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,150%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:10px;z-index:50;transition:transform .25s;max-width:90vw}
.toast.show{transform:translate(-50%,0)}
.thumb{width:28px;height:28px;object-fit:contain;border-radius:5px;vertical-align:middle;margin-right:.5em;background:var(--surface2)}
.imgzone{display:flex;flex-direction:column;gap:.4rem;align-items:flex-start;padding:.6rem;border:1px dashed var(--line);border-radius:10px;margin-bottom:.6rem}
.imgzone img{max-width:100%;max-height:220px;object-fit:contain;border-radius:8px}
.marker .subdot{position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:50%;background:var(--gold);border:2px solid var(--surface)}
.steps{padding-left:1.3rem}.steps li{margin:.35rem 0}
code{background:var(--surface2);padding:0 .3em;border-radius:4px}
.perso3{display:grid;grid-template-columns:150px minmax(0,1fr) minmax(320px,440px);gap:1rem;align-items:start}
@media (max-width:1150px){.perso3{grid-template-columns:120px minmax(0,1fr)}.perso3>.sheet{grid-column:1/-1}}
@media (max-width:700px){.perso3{grid-template-columns:1fr}.band{flex-direction:row!important;overflow-x:auto;position:static!important}}
.band{display:flex;flex-direction:column;gap:.6rem;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.bandbtn{display:flex;flex-direction:column;align-items:center;gap:.3rem;padding:.8rem .4rem;border-radius:14px;border:2px solid var(--line);background:var(--surface2);font-weight:700;white-space:normal;text-align:center;min-width:100px}
.bandbtn[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bandimg{width:52px;height:52px;border-radius:50%;object-fit:cover}
.bandadd{font-size:2rem;line-height:1;width:56px;height:56px;padding:0;border-radius:50%;align-self:center;border:3px solid var(--ink);background:transparent;flex:none}
.eqgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;max-width:620px;margin:0 auto}
.eqcell{position:relative;aspect-ratio:1}
.eqbtn{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;border:2px solid var(--muted);border-radius:6px;background:var(--surface);white-space:normal;text-align:center;overflow:hidden}
.eqbtn:hover{border-color:var(--accent)}
.eqcell.on .eqbtn{border-color:var(--rc);background:color-mix(in srgb,var(--rc) 18%,var(--surface))}
.eqlabel{font-size:.68rem;font-weight:700;color:var(--muted);line-height:1.15}
.eqname{font-size:.7rem;line-height:1.1;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.eqimg{width:60%;max-height:55%;object-fit:contain}
.eqx{position:absolute;top:2px;right:2px;padding:0 .3em;font-size:.7rem;line-height:1.4;background:var(--surface);border-radius:4px}
.partybar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.partybtn{display:flex;align-items:center;gap:.4rem;padding:.55rem 1.3rem;border-radius:12px;border:2px solid var(--line);background:var(--surface2);font-weight:700;font-size:1.05rem}
.partybtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.partybtn .bandimg{width:28px;height:28px}
.partymore{border:2px solid var(--ink);border-radius:10px;font-weight:700}
.sb-enemies{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(200px,1fr);gap:1rem;align-items:stretch}
.sb-main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:1rem;margin-top:1rem;align-items:start}
@media (max-width:860px){.sb-enemies,.sb-main{grid-template-columns:1fr}}
.sb-add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;border:2px dashed var(--line);border-radius:16px;background:transparent;font-size:1rem;color:var(--muted);min-height:140px;white-space:normal}
.sb-add span{display:flex;width:64px;height:64px;border-radius:50%;border:3px solid var(--ink);align-items:center;justify-content:center;font-size:2.4rem;color:var(--ink);line-height:1}
.enemychips{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.6rem}
.enchip{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.enchip button{border:0;border-radius:0;background:var(--surface2);padding:.25em .7em}

/* =========================================================
   MOTEUR DE DÉS (distributions exactes)
   ========================================================= */
function parseDice(str){
  const out={dice:[],flat:0};
  if(!str) return out;
  const s=String(str).replace(/\s+/g,'').replace(/−/g,'-').toLowerCase();
  const re=/([+-]?)(\d*)d(\d+)|([+-]?)(\d+)/g; let m;
  while((m=re.exec(s))){
    if(m[3]){const n=+(m[2]||1),sd=+m[3];if(m[1]!=='-'&&n>0&&n<=40&&sd>=1&&sd<=100)out.dice.push([n,sd]);}
    else if(m[5]) out.flat+=(m[4]==='-'?-1:1)*+m[5];
  }
  return out;
}
function parseComps(str,defType){
  return String(str||'').split(/[,;]/).map(p=>p.trim()).filter(Boolean).map(p=>{
    const m=p.match(/^([0-9dD+\-−\s]+)\s*(.*)$/); if(!m) return null;
    const d=parseDice(m[1]); if(!d.dice.length&&!d.flat) return null;
    return {...d,type:normType(m[2])||defType};
  }).filter(Boolean);
}
function conv(a,b){
  const o=new Array(a.length+b.length-1).fill(0);
  for(let i=0;i<a.length;i++){const ai=a[i];if(!ai)continue;for(let j=0;j<b.length;j++)o[i+j]+=ai*b[j];}
  return o;
}
function dieD(s,gwf){
  const o=new Array(s+1).fill(0);
  for(let k=1;k<=s;k++) o[k]=(gwf&&s>=3)?((k<=2?0:1/s)+2/(s*s)):1/s;
  return o;
}
function diceD(list,gwf){let o=[1];for(const [n,s] of list)for(let i=0;i<n;i++)o=conv(o,dieD(s,gwf));return o;}
function shiftD(d,c){const r=new Array(Math.max(1,d.length+c)).fill(0);d.forEach((p,i)=>{r[Math.max(0,i+c)]+=p;});return r;}
function maxTwo(d){const o=new Array(d.length).fill(0);let c=0,prev=0;for(let i=0;i<d.length;i++){c+=d[i];o[i]=c*c-prev*prev;prev=c;}return o;}
function resistD(d,mode){
  if(mode==='none') return d;
  const tot=d.reduce((a,b)=>a+b,0);
  if(mode==='imm') return [tot];
  const o=[];d.forEach((p,i)=>{const v=mode==='res'?Math.floor(i/2):i*2;o[v]=(o[v]||0)+p;});
  for(let i=0;i<o.length;i++)o[i]=o[i]||0;return o;
}
const scaleD=(d,k)=>d.map(p=>p*k);
function addD(a,b){const o=new Array(Math.max(a.length,b.length)).fill(0);a.forEach((p,i)=>o[i]+=p);b.forEach((p,i)=>o[i]+=p);return o;}
function capD(d,cap){if(d.length<=cap+1)return d;const o=d.slice(0,cap+1);o[cap]=d.slice(cap).reduce((a,b)=>a+b,0);return o;}
function dstats(d){
  let mean=0,m2=0;d.forEach((p,i)=>{mean+=p*i;m2+=p*i*i;});
  const q=x=>{let c=0;for(let i=0;i<d.length;i++){c+=d[i];if(c>=x-1e-12)return i;}return d.length-1;};
  let max=0;for(let i=d.length-1;i>=0;i--)if(d[i]>1e-12){max=i;break;}
  return {mean,sd:Math.sqrt(Math.max(0,m2-mean*mean)),med:q(.5),p10:q(.1),p90:q(.9),max};
}
function d20Dist(mode,lucky){
  const b=new Array(21).fill(0);
  for(let k=1;k<=20;k++) b[k]=lucky?(k===1?1/400:1/20+1/400):1/20;
  if(mode==='normal') return b;
  const c=[0];for(let k=1;k<=20;k++)c[k]=c[k-1]+b[k];
  const o=new Array(21).fill(0);
  for(let k=1;k<=20;k++) o[k]=mode==='adv'?c[k]*c[k]-c[k-1]*c[k-1]:(1-c[k-1])**2-(1-c[k])**2;
  return o;
}
function bonusDieDist(str){const b=parseDice(str);if(!b.dice.length&&!b.flat)return{d:[1],off:0};return{d:diceD(b.dice,false),off:b.flat};}

function attackProbs(cfg,ac){
  const d20=d20Dist(cfg.mode,cfg.lucky);
  const bd=bonusDieDist(cfg.atkDie);
  const atk=(+cfg.atk||0)-(cfg.powerFeat&&cfg.power?5:0)+bd.off;
  const crit=clamp(+cfg.crit||20,2,20);
  let ph=0,pc=0;
  for(let r=1;r<=20;r++){
    const p=d20[r];if(!p)continue;
    if(r>=crit){pc+=p;continue;}
    if(r===1)continue;
    for(let b=0;b<bd.d.length;b++) if(bd.d[b]&&r+atk+b>=ac) ph+=p*bd.d[b];
  }
  return {ph,pc,pm:Math.max(0,1-ph-pc)};
}
function hitDists(cfg,target,withOnce){
  const wType=cfg.wtype||'tranchant';
  const w=parseDice(cfg.weapon);
  const extras=parseComps(cfg.extra,wType);
  const once=withOnce?parseComps(cfg.once,wType):[];
  const make=crit=>{
    const groups=new Map();
    const add=(t,d)=>groups.set(t,groups.has(t)?conv(groups.get(t),d):d);
    const k=crit?2:1;
    let wd=diceD(w.dice.map(([n,s])=>[n*k,s]),!!cfg.gwf);
    if(cfg.savage) wd=maxTwo(wd);
    add(wType,shiftD(wd,w.flat+(cfg.powerFeat&&cfg.power?10:0)));
    for(const e of [...extras,...once]) add(e.type,shiftD(diceD(e.dice.map(([n,s])=>[n*k,s]),false),e.flat));
    let tot=[1];
    for(const [t,d] of groups){
      const mode=(target.imm||[]).includes(t)?'imm':(target.res||[]).includes(t)?'res':(target.vul||[]).includes(t)?'vul':'none';
      tot=conv(tot,resistD(d,mode));
    }
    return tot;
  };
  return {hit:make(false),crit:make(true)};
}
function saveSuccess(cfg,target){
  const ab=cfg.saveAb||'dex';const m=+((target.saves||{})[ab]||0);
  const d20=d20Dist(target.saveMode||'normal',false);let p=0;
  for(let r=1;r<=20;r++) if(r+m>=(+cfg.dc||10)) p+=d20[r];
  return p;
}
function turnDist(cfg,target){
  const kind=cfg.kind||'weapon';
  const n=clamp(+cfg.attacks||1,1,12);
  let ph,pc,pm,one;
  if(kind==='save'||kind==='auto'){
    const full=hitDists({...cfg,gwf:false,savage:false,powerFeat:false},target,false).hit;
    if(kind==='auto'){ph=1;pc=0;pm=0;one=full;}
    else{
      const ps=saveSuccess(cfg,target);ph=1-ps;pc=0;pm=ps;
      const onS=cfg.onSave==='half'?resistD(full,'res'):[1];
      one=addD(scaleD(full,1-ps),scaleD(onS,ps));
    }
    let turn=[1];for(let i=0;i<n;i++)turn=conv(turn,one);
    return {turn,ph,pc,one};
  }
  const c2=kind==='spellatk'?{...cfg,gwf:false,savage:false,powerFeat:false}:cfg;
  ({ph,pc,pm}=attackProbs(c2,+target.ac||10));
  const base=hitDists(c2,target,false);
  one=addD(addD([pm],scaleD(base.hit,ph)),scaleD(base.crit,pc));
  let turn;
  if(!parseComps(c2.once,c2.wtype).length){turn=[1];for(let i=0;i<n;i++)turn=conv(turn,one);}
  else{
    const wo=hitDists(c2,target,true);
    const first=addD(scaleD(wo.hit,ph),scaleD(wo.crit,pc));
    let U=[1],D=[0];
    for(let i=0;i<n;i++){const nU=scaleD(U,pm);const nD=addD(conv(D,one),conv(U,first));U=nU;D=nD;}
    turn=addD(U,D);
  }
  return {turn,ph,pc,one};
}
function killCurve(turn,hp,turns=5){
  hp=Math.max(1,Math.round(hp));const t1=capD(turn,hp);let cum=[1];const out=[];
  for(let t=1;t<=turns;t++){cum=capD(conv(cum,t1),hp);out.push(cum.length>hp?cum[hp]:0);}
  return out;
}
function checkProb(c){
  const d20=d20Dist(c.mode,c.lucky);const bd=bonusDieDist(c.bonus);const m=(+c.mod||0)+bd.off;let p=0;
  for(let r=1;r<=20;r++){
    if(c.nat&&r===20){p+=d20[r];continue;}
    if(c.nat&&r===1)continue;
    for(let b=0;b<bd.d.length;b++) if(bd.d[b]&&r+m+b>=(+c.dc||10)) p+=d20[r]*bd.d[b];
  }
  return p;
}

const CHUNK_BYTES=180000;
const Store={
  db:null,uid:null,assets:null,downloads:null,timers:{},chain:{},sent:{},nChunks:{},
  keys:['items','spells','lore','images','builds','notes','npcs','maps','sandbox'],
  pack(k){switch(k){
    case 'items':return {list:S.customItems};
    case 'spells':return {list:S.spells};
    case 'lore':return {list:S.lore};
    case 'images':return {map:S.images};
    case 'builds':return {list:S.builds,current:S.current};
    case 'notes':return {list:S.notes};
    case 'npcs':return {list:S.npcs};
    case 'maps':return {list:S.maps};
    case 'sandbox':return {...S.sandbox};
  }},
  unpack(k,d){if(!d)return;switch(k){
    case 'items':S.customItems=Array.isArray(d.list)?d.list:[];break;
    case 'spells':S.spells=Array.isArray(d.list)?d.list:[];break;
    case 'lore':S.lore=Array.isArray(d.list)?d.list:[];break;
    case 'images':S.images=d.map&&typeof d.map==='object'?{...d.map}:{};break;
    case 'builds':if(Array.isArray(d.list)&&d.list.length){S.builds=d.list;S.current=d.current||d.list[0].id;}break;
    case 'notes':S.notes=Array.isArray(d.list)?d.list:[];break;
    case 'npcs':S.npcs=Array.isArray(d.list)?d.list:[];break;
    case 'maps':if(Array.isArray(d.list)&&d.list.length)S.maps=d.list;break;
    case 'sandbox':if(d.A&&d.B&&d.target){S.sandbox={...S.sandbox,...d};S.sandbox.A={...newCfg(''),...d.A};S.sandbox.B={...newCfg(''),...d.B};S.sandbox.target={saves:blankSaves(),saveMode:'normal',...d.target};}break;
  }},
  loadLocal(){try{const raw=localStorage.getItem('bg3codex:v1');if(!raw)return false;const o=JSON.parse(raw);for(const k of this.keys)this.unpack(k,o[k]);return true;}catch(e){return false;}},
  saveLocal(){try{const o={};for(const k of this.keys)o[k]=this.pack(k);localStorage.setItem('bg3codex:v1',JSON.stringify(o));}catch(e){}},
  touch(k){
    this.saveLocal();
    if(!this.db)return;
    clearTimeout(this.timers[k]);
    this.timers[k]=setTimeout(()=>this.flush(k),700);
  },
  split(data){
    if(!Array.isArray(data.list))return [data];
    const chunks=[];let cur=[],size=0;
    for(const it of data.list){const n=JSON.stringify(it).length+1;if(cur.length&&size+n>CHUNK_BYTES){chunks.push(cur);cur=[];size=0;}cur.push(it);size+=n;}
    chunks.push(cur);
    const {list,...rest}=data;
    return chunks.map((c,i)=>i===0?{...rest,list:c,chunks:chunks.length}:{list:c});
  },
  flush(k){
    const parts=this.split(clone(this.pack(k)));
    const old=this.nChunks[k]||1;this.nChunks[k]=parts.length;
    setSync('busy');
    this.chain[k]=(this.chain[k]||Promise.resolve()).then(async()=>{
      for(let i=parts.length-1;i>=0;i--){
        const key=k+'#'+i,str=JSON.stringify(parts[i]);
        if(this.sent[key]===str)continue;
        await this.ref(k,i).set(parts[i]);this.sent[key]=str;
      }
      for(let i=parts.length;i<old;i++){await this.ref(k,i).delete();delete this.sent[k+'#'+i];}
    }).then(()=>setSync('ok')).catch(e=>{console.warn(e);setSync('err',e&&e.code==='invalid_argument'?'un enregistrement est trop volumineux':'');});
  },
  ref(k,i){return this.db.collection('data/users/'+this.uid).doc('codex-'+k+(i?'-'+i:''));},
  async load(k){
    const snap=await this.ref(k,0).get();if(!snap.exists)return null;
    const d=clone(snap.data());const n=+d.chunks||1;this.nChunks[k]=n;this.sent[k+'#0']=JSON.stringify(snap.data());
    for(let i=1;i<n;i++){const s2=await this.ref(k,i).get();if(s2.exists){const c=s2.data();this.sent[k+'#'+i]=JSON.stringify(c);d.list=(d.list||[]).concat(clone(c.list||[]));}}
    delete d.chunks;return d;
  },
  async connect(){
    if(!(window.claude&&typeof window.claude.use==='function')){setSync('local');return;}
    const timer=setTimeout(()=>{if(!this.db)setSync('local');},10000);
    try{
      const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
      if(!db||!user){clearTimeout(timer);setSync('local');return;}
      const id=await user.id();
      if(!id){clearTimeout(timer);setSync('local');return;}
      this.db=db;this.uid=id;
      for(const k of this.keys){
        const d=await this.load(k);
        if(d)this.unpack(k,d);else this.flush(k);
      }
      clearTimeout(timer);setSync('ok');this.saveLocal();ensureDefaults();rebuildItems();renderCurrent();
    }catch(e){clearTimeout(timer);console.warn(e);setSync('local');}
    claude.use('assets').then(a=>{this.assets=a;renderCurrent();}).catch(()=>{});
    claude.use('downloads').then(d=>{this.downloads=d;}).catch(()=>{});
  }
};

  el.className='sync '+(state==='ok'?'ok':state==='err'?'err':'');
  el.textContent=state==='ok'?'Enregistré sur ton compte':state==='busy'?'Enregistrement…':state==='err'?('Échec de l’enregistrement'+(msg?' : '+msg:'')):'Enregistré sur cet appareil';
}

  switch(it.cat){
    case 'Casque':return['head'];case 'Cape':return['cloak'];case 'Armure':return['body'];case 'Gants':return['hands'];
    case 'Bottes':return['feet'];case 'Amulette':return['neck'];case 'Anneau':return['ring1','ring2'];case 'Bouclier':return['offhand'];

const PB_COST={8:0,9:1,10:2,11:3,12:4,13:5,14:7,15:9};
const curBuild=()=>S.builds.find(b=>b.id===S.current)||S.builds[0];

function derive(b){
  const classes=(b.classes||[]).filter(c=>CLASSES[c.cls]);
  const lvl=classes.reduce((s,c)=>s+(+c.lvl||0),0);
  const pb=lvl>=9?4:lvl>=5?3:2;
  const clsLvl=id=>classes.filter(c=>c.cls===id).reduce((s,c)=>s+(+c.lvl||0),0);
  const hasSub=(cls,sub,lv)=>classes.some(c=>c.cls===cls&&c.sub===sub&&(+c.lvl||0)>=(lv||CLASSES[cls].subAt));

  let featSlots=0;const featLevels=[];
  for(const c of classes){const lv=CLASSES[c.cls].featLv||[4,8,12];lv.filter(x=>x<=c.lvl).forEach(x=>featLevels.push(CLASSES[c.cls].n+' '+x));featSlots+=lv.filter(x=>x<=c.lvl).length;}
  const feats=(b.feats||[]).slice(0,featSlots);
  const featIds=new Set(feats.map(f=>f&&f.id).filter(Boolean));

  const spent=ABK.reduce((s,k)=>s+(PB_COST[b.base[k]]??99),0);
  const sc={};ABK.forEach(k=>sc[k]=+b.base[k]||8);
  if(b.plus2&&sc[b.plus2]!=null)sc[b.plus2]+=2;
  if(b.plus1&&sc[b.plus1]!=null)sc[b.plus1]+=1;
  for(const f of feats){if(!f)continue;if(f.id==='asi'){if(f.a)sc[f.a]+=1;if(f.b)sc[f.b]+=1;}else if(f.p1&&FEATN[f.id]&&FEATN[f.id].p1)sc[f.p1]+=1;}
  ABK.forEach(k=>sc[k]=Math.min(20,sc[k]));

  const eq={};for(const [s,id] of Object.entries(b.equip||{})){const it=ITEMS.get(id);if(it)eq[s]=it;}
  const items=Object.values(eq);
  for(const it of items){const set=effB(it).set;if(set)for(const k in set)if(sc[k]!=null)sc[k]=Math.max(sc[k],+set[k]);}
  const m=Object.fromEntries(ABK.map(k=>[k,mod(sc[k])]));
  const sumB=key=>items.reduce((s,it)=>s+(+(effB(it)[key])||0),0);const sumM=(key,sub)=>items.reduce((s,it)=>s+(+((effB(it)[key]||{})[sub])||0),0);ABK.forEach(k=>{sc[k]+=sumM('abil',k);m[k]=mod(sc[k]);});

  // maîtrises
  const armP=new Set(),wpnP=new Set();
  classes.forEach(c=>{const C=CLASSES[c.cls];C.arm.forEach(x=>armP.add(x));C.wpn.forEach(x=>wpnP.add(x));const sp=C.subProf&&C.subProf[c.sub];if(sp){(sp.arm||[]).forEach(x=>armP.add(x));(sp.wpn||[]).forEach(x=>wpnP.add(x));}});
  const R=RACES[b.race]||{};(R.wpn||[]).forEach(x=>wpnP.add(x));(R.arm||[]).forEach(x=>armP.add(x));
  feats.forEach(f=>{const F=f&&FEATN[f.id];if(F&&F.arm)F.arm.forEach(x=>armP.add(x));});
  const profW=it=>!!it.w&&(wpnP.has(it.w.kind)||wpnP.has(it.w.group));

  // CA
  const body=eq.body&&eq.body.a?eq.body:null;
  const shield=eq.offhand&&eq.offhand.a&&eq.offhand.a.type==='shield'?eq.offhand:null;
  let ac,acHow;
  if(body){
    const t=body.a.type;const cap=t==='light'?99:t==='medium'?(featIds.has('medmaster')?3:2):0;
    ac=(body.a.base==null?10:+body.a.base)+Math.min(m.dex,cap);acHow=`${body.name} (${body.a.base??'CA à renseigner'}${cap?' + DEX'+(cap<99?' max '+cap:''):''})`;
  }else{
    const c=[[10+m.dex,'Sans armure (10 + DEX)']];
    if(clsLvl('barbare'))c.push([10+m.dex+m.con,'Défense sans armure (10 + DEX + CON)']);
    if(clsLvl('moine')&&!shield)c.push([10+m.dex+m.wis,'Défense sans armure (10 + DEX + SAG)']);
    if(hasSub('ensorceleur','Lignée draconique'))c.push([13+m.dex,'Résistance draconique (13 + DEX)']);
    c.sort((x,y)=>y[0]-x[0]);[ac,acHow]=c[0];
  }
  if(shield)ac+=+shield.a.base;
  ac+=sumB('ac');
  if(b.style==='defence'&&body)ac+=1;
  if(featIds.has('dual')&&isWeapon(eq.mainhand)&&isWeapon(eq.offhand))ac+=1;

  // PV
  let hp=0;
  classes.forEach((c,i)=>{const hd=CLASSES[c.cls].hd;for(let l=1;l<=c.lvl;l++)hp+=(i===0&&l===1?hd:hd/2+1)+m.con;});
  if(featIds.has('tough'))hp+=2*lvl;
  if(hasSub('ensorceleur','Lignée draconique'))hp+=clsLvl('ensorceleur');
  hp+=(+b.hpBonus||0)+sumB('hp');

  const init=m.dex+(featIds.has('alert')?5:0)+sumB('init');
  const first=classes[0]?CLASSES[classes[0].cls]:null;
  const saveP=new Set(first?first.saves:[]);
  feats.forEach(f=>{if(f&&f.id==='resilient'&&f.p1)saveP.add(f.p1);});
  const saves=Object.fromEntries(ABK.map(k=>[k,m[k]+(saveP.has(k)?pb:0)+sumB('save')+sumM('saveAb',k)]));

  const casters=[];
  classes.forEach(c=>{const C=CLASSES[c.cls];const ab=C.cast||(C.subCast&&C.subCast[c.sub]);if(ab&&!casters.find(x=>x.cls===c.cls))casters.push({cls:c.cls,n:C.n,ab,dc:8+pb+m[ab]+sumB('dc'),atk:pb+m[ab]+sumB('spellatk')});});

  const bgSk=new Set((BACKGROUNDS[b.bg]||{sk:[]}).sk);
  const skills=SKILLS.map(([id,n,ab])=>{const prof=bgSk.has(id)||!!(b.skills||{})[id];const ex=prof&&!!(b.expert||{})[id];return {id,n,ab,bg:bgSk.has(id),prof,ex,v:m[ab]+(prof?pb:0)+(ex?pb:0)+sumM('skills',id)};});

  let extraAtk=1;const fl=clsLvl('guerrier');if(fl>=11)extraAtk=3;else if(fl>=5)extraAtk=2;
  ['barbare','paladin','rodeur','moine'].forEach(c=>{if(clsLvl(c)>=5)extraAtk=Math.max(extraAtk,2);});
  if(hasSub('barde','Vaillance',6)||hasSub('barde','Épées',6)||hasSub('magicien','Chant de la lame',6))extraAtk=Math.max(extraAtk,2);

  const styleOK=fl>=1||clsLvl('paladin')>=2||clsLvl('rodeur')>=2||hasSub('barde','Épées',3);
  const crit=(hasSub('guerrier','Champion',3)?19:20)-sumB('crit');
  const rogue=clsLvl('roublard');const barb=clsLvl('barbare');

  const attack=slot=>{
    const it=eq[slot];if(!it||!it.w)return null;
    const w=it.w,p=w.props||[],ranged=!!w.ranged;
    let ab=ranged?'dex':(p.includes('finesse')&&m.dex>m.str?'dex':'str');
    if(!ranged&&clsLvl('moine')&&(w.kind==='simple'||w.group==='shortsword')&&!p.includes('heavy')&&!p.includes('twohanded')&&m.dex>m.str)ab='dex';
    const prof=profW(it);const ench=+(w.enchant||0);
    let toHit=m[ab]+(prof?pb:0)+ench+sumB('att');
    if(ranged&&b.style==='archery')toHit+=2;
    const isOff=slot==='offhand'||slot==='rangedOff';
    const twoHand=!ranged&&(p.includes('twohanded')||(p.includes('versatile')&&slot==='mainhand'&&!eq.offhand));
    const dice=twoHand&&w.vers&&!p.includes('twohanded')?w.vers:w.dice;
    let flat=ench+sumB('dmg');
    if(!isOff||b.style==='twf'||m[ab]<0)flat+=m[ab];
    if(!ranged&&b.style==='duelling'&&slot==='mainhand'&&!twoHand&&!isWeapon(eq.offhand))flat+=2;
    const rage=barb&&ab==='str'&&!ranged?(barb>=9?3:2):0;
    return {slot,name:it.name,ab,prof,toHit,dice,flat,rage,dtype:w.dtype||'tranchant',extra:(w.extra||[]).map(e=>`${e.dice} ${e.type||''}`.trim()).join(', '),
      gwf:b.style==='gwf'&&!ranged&&twoHand,savage:featIds.has('savage')&&!ranged,
      powerFeat:(featIds.has('gwm')&&!ranged&&p.includes('heavy')&&prof)||(featIds.has('ss')&&ranged&&prof),
      attacks:isOff?1:extraAtk,crit,lucky:!!R.lucky,
      sneak:rogue&&(p.includes('finesse')||ranged)?Math.ceil(rogue/2):0,
      offLight:isOff&&!ranged&&!p.includes('light')&&!featIds.has('dual')};
  };
  const attacks=['mainhand','offhand','rangedMain','rangedOff'].map(attack).filter(Boolean);

  // à compléter
  const todo=[];
  if(lvl>12)todo.push({w:1,t:`Niveau total ${lvl} : le maximum est 12.`});
  classes.forEach(c=>{if(c.lvl>=CLASSES[c.cls].subAt&&!c.sub)todo.push({t:`Choisir la sous-classe de ${CLASSES[c.cls].n} (disponible au niveau ${CLASSES[c.cls].subAt}).`});});
  if(spent!==27)todo.push({w:spent>27,t:spent>27?`Points de caractéristiques dépassés : ${spent} sur 27.`:`Il reste ${27-spent} point(s) de caractéristiques à répartir.`});
  if(ABK.some(k=>b.base[k]<8||b.base[k]>15))todo.push({w:1,t:'Les valeurs de départ doivent rester entre 8 et 15.'});
  if(b.plus2&&b.plus2===b.plus1)todo.push({w:1,t:'Le +2 et le +1 doivent aller dans deux caractéristiques différentes.'});
  const missingFeats=featSlots-feats.filter(f=>f&&f.id).length;
  if(missingFeats>0)todo.push({t:`Choisir ${missingFeats} don(s).`});
  if(styleOK&&!b.style)todo.push({t:'Choisir un style de combat.'});
  const twoH=isWeapon(eq.mainhand)&&(eq.mainhand.w.props||[]).includes('twohanded');
  const empty=CORE_SLOTS.filter(s=>!eq[s]&&!(s==='offhand'&&twoH));
  if(empty.length)todo.push({t:`Emplacements vides : ${empty.map(s=>SLOTS[s].toLowerCase()).join(', ')}.`});
  if(body&&!armP.has(body.a.type))todo.push({w:1,t:`Armure non maîtrisée (${ARMT[body.a.type].toLowerCase()}) : désavantage aux jets et pas de sorts.`});
  if(body&&body.a.base==null)todo.push({w:1,t:`La CA de base de ${body.name} n’est pas renseignée : modifie sa fiche dans le glossaire.`});
  if(shield&&!armP.has('shield'))todo.push({w:1,t:'Bouclier non maîtrisé.'});
  attacks.forEach(a=>{if(!a.prof)todo.push({w:1,t:`${a.name} n’est pas maîtrisée : pas de bonus de maîtrise au toucher.`});if(a.offLight)todo.push({w:1,t:`${a.name} en main secondaire n’est pas une arme légère : il faut le don Combat à deux armes.`});});
  if(isWeapon(eq.mainhand)&&(eq.mainhand.w.props||[]).includes('twohanded')&&eq.offhand)todo.push({w:1,t:'Arme à deux mains en main principale : la main secondaire doit rester libre.'});

  return {lvl,pb,sc,m,spent,featSlots,featLevels,feats,featIds,eq,ac,acHow,hp,init,saves,saveP,casters,skills,extraAtk,styleOK,attacks,todo,armP,wpnP,profW};
}

function keepFocus(fn){

}

function glossFiltered(){
  const q=G.q.trim().toLowerCase();
  let list=[...ITEMS.values()].filter(i=>
    (!G.cat||i.cat===G.cat)&&(G.act===''||(G.act==='?'?(i.act==null||i.act===''):(i.act!=null&&i.act!==''&&String(+i.act||0)===G.act)))&&(!G.rar||i.rarity===G.rar)&&(!G.src||i.source===G.src)&&
    (!q||[i.name,i.en,i.desc,i.source,i.cat].some(x=>String(x||'').toLowerCase().includes(q))));
  const key={name:i=>i.name.toLowerCase(),price:i=>i.price==null?Infinity:+i.price,rarity:i=>(RAR[i.rarity]||{o:0}).o,act:i=>(i.act==null||i.act==='')?9:(+i.act||0),cat:i=>CATS.indexOf(i.cat)}[G.sort];
  list.sort((a,b)=>{const x=key(a),y=key(b);const r=typeof x==='string'?x.localeCompare(y,'fr'):(x-y);return (r||a.name.localeCompare(b.name,'fr'))*G.dir;});
  return list;
}

function bonusLine(bn){

      <label>Prix (po)<input type="number" data-qi="price" data-id="${esc(i.id)}" value="${i.price??''}"></label></div></fieldset>`:''}
    ${linksPanel('item:'+i.id)}
    <div class="row" style="margin-top:1rem">
      ${slots.map(s=>`<button class="primary" data-act="equip" data-id="${esc(i.id)}" data-slot="${s}">Équiper : ${SLOTS[s].toLowerCase()}</button>`).join('')}
      ${slots.length?`<span class="small muted">sur « ${esc(b.name)} »</span>`:''}
    </div>
    <div class="row" style="margin-top:.8rem">

    </div>`);
}

const slug=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const truthy=v=>v===true||v===1||['1','yes','true','oui'].includes(String(v).toLowerCase());
function cleanWiki(t){let x=String(t||'');for(let i=0;i<4;i++)x=x.replace(/\{\{[^{}]*?\|([^{}|]*)\}\}/g,'$1').replace(/\{\{([^{}|]*)\}\}/g,'$1');return x.replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g,'$1').replace(/'''?/g,'').replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/[ \t]+/g,' ').trim();}
function fget(r,...names){for(const n of names)for(const k of [n,n.replace(/_/g,' '),n.replace(/ /g,'_')]){const v=r[k];if(v!=null&&v!==''&&!(Array.isArray(v)&&!v.length))return Array.isArray(v)?v.join(', '):v;}return null;}
function unwrapRows(o){if(o&&o.cargoquery)o=o.cargoquery;if(!Array.isArray(o))return null;return o.map(r=>r&&r.title&&typeof r.title==='object'?r.title:r).filter(r=>r&&typeof r==='object');}
function detectKind(rows){const r=rows.find(x=>x)||{};if(rows.slice(0,300).some(x=>MISC_TYPES.has(String(fget(x,'type')||''))&&('book_author' in x||'book author' in x||'camp_supplies' in x||'action_type' in x||'action type' in x||!('proficiency' in x)&&!('armour_class' in x))))return 'misc';if(rows.slice(0,50).some(x=>('hp' in x)&&('ac' in x)))return 'creatures';if(rows.slice(0,50).some(x=>'spell_level' in x||'spell level' in x||'spell_school' in x||'spell school' in x))return 'spells';if(fget(r,'damage_type')!=null&&fget(r,'handedness','category')!=null)return 'weapons';if(fget(r,'school')!=null)return 'spells';if(fget(r,'type')!=null)return 'equipment';return null;}
const GROUP_KEYS=Object.entries({'hand crossbow':'handxbow','heavy crossbow':'heavyxbow','light crossbow':'lightxbow','light hammer':'lighthammer','war pick':'warpick',greatclub:'greatclub',greataxe:'greataxe',greatsword:'greatsword',warhammer:'warhammer',battleaxe:'battleaxe',handaxe:'handaxe',quarterstaff:'quarterstaff',quarterstave:'quarterstaff',longsword:'longsword',shortsword:'shortsword',morningstar:'morningstar',longbow:'longbow',shortbow:'shortbow',javelin:'javelin',scimitar:'scimitar',halberd:'halberd',trident:'trident',dagger:'dagger',rapier:'rapier',glaive:'glaive',sickle:'sickle',spear:'spear',flail:'flail',club:'club',mace:'mace',maul:'maul',pike:'pike',dart:'dart',sling:'sling'}).sort((a,b)=>b[0].length-a[0].length);
const bumpDie=d=>String(d||'').replace(/d(\d+)/,(m,n)=>'d'+({4:6,6:8,8:10,10:12}[n]||n));
const enFR=t=>DTYPE_EN[String(t||'').toLowerCase()]||normType(t)||'tranchant';
const rarFR=r=>RAR_EN[String(r||'').toLowerCase()]||'commune';
function weaponFromWiki(r){
  const page=fget(r,'_pageName','name');const name=fget(r,'name')||page;
  const typ=String(fget(r,'type')||'').toLowerCase();
  const g=(GROUP_KEYS.find(([k])=>typ.includes(k))||[])[1]||'dagger';

  const dice=dmg.dice.map(([n,sd])=>n+'d'+sd).join('+')||'1d4';

    desc:cleanWiki(fget(r,'special'))};
}
function equipFromWiki(r){

  if(t.includes('shield')){it.cat='Bouclier';it.a={type:'shield',base:2};if(ench)it.bonus={ac:ench};}
  else if(t.includes('armour')||t.includes('armor')){it.cat='Armure';const ty=t.includes('heavy')?'heavy':t.includes('medium')?'medium':'light';it.a={type:ty,base:ac!=null?+ac:null,stealth:false};if(ac==null&&ench)it.desc=(it.desc+`\nEnchantement +${ench}.`).trim();}
  else if(t.includes('cloth')){it.cat='Armure';}
  else if(t.includes('helm')||t.includes('head')||t.includes('hat')||t.includes('circlet')||t.includes('mask')){it.cat='Casque';}

function spellFromWiki(r){
  const page=fget(r,'_pageName','name');const name=fget(r,'name')||page;

    cast:cost.includes('bonus')?'Action bonus':cost.includes('reaction')?'Réaction':'Action',conc:truthy(fget(r,'is_concentration','concentration')),count:1,countUp:0,scale:level===0&&dmg?'dice':null,up:null,dice:dmg?String(dmg).replace(/\s+/g,''):'',dtype:enFR(fget(r,'damage_type')),save,onSave:level===0?'none':'half',

const npcLabel=n=>n.name+(n.stats&&n.stats.level?` (niv. ${n.stats.level})`:'');
function importCreature(r){
  const page=fget(r,'_pageName','name');const name=fget(r,'name')||page;
  const ab={str:+fget(r,'strength')||10,dex:+fget(r,'dexterity')||10,con:+fget(r,'constitution')||10,int:+fget(r,'intelligence')||10,wis:+fget(r,'wisdom')||10,cha:+fget(r,'charisma')||10};

function mergeInto(list,obj,keep){const ix=list.findIndex(x=>x.id===obj.id);if(ix<0){list.push(obj);return 'new';}const old=list[ix];const m={...obj};for(const k of keep)if(old[k]!=null&&old[k]!=='')m[k]=old[k];list[ix]=m;return 'upd';}

function importText(txt){

function equip(id,slot){

  if(slot==='offhand'){const mh=ITEMS.get(b.equip.mainhand);if(mh&&mh.w&&(mh.w.props||[]).includes('twohanded'))delete b.equip.mainhand;}
  Store.touch('builds');

function setPath(obj,path,val){const ks=path.split('.');let o=obj;for(let i=0;i<ks.length-1;i++){const k=ks[i];if(o[k]==null)o[k]=/^\d+$/.test(ks[i+1])?[]:{};o=o[k];}o[ks[ks.length-1]]=val;}
function onBuildChange(el){
  const b=curBuild();const path=el.dataset.b;
  let v=el.type==='checkbox'?el.checked:el.value;
  if(el.hasAttribute('data-num'))v=+v||0;
  if(path.startsWith('classes.')&&path.endsWith('.lvl'))v=clamp(v,1,12);
  if(path.startsWith('feats.')){const i=+path.split('.')[1];b.feats=b.feats||[];while(b.feats.length<=i)b.feats.push(null);if(!b.feats[i])b.feats[i]={};if(path.endsWith('.id'))b.feats[i]={id:v};else setPath(b,path,v);}
  else setPath(b,path,v);
  if(path.endsWith('.cls')){const i=+path.split('.')[1];b.classes[i].sub='';}
  if(path.startsWith('skills.')&&!v&&b.expert){delete b.expert[path.split('.')[1]];}
  Store.touch('builds');renderPerso();
}

function drawChart(a,b,hp){
  const W=900,H=280,pl=44,pr=12,pt=14,pb=34;
  const lastSig=d=>{let c=0,last=0;for(let i=0;i<d.length;i++){c+=d[i];last=i;if(c>0.9995)break;}return last;};
  let maxX=Math.max(lastSig(a),lastSig(b),hp+2,10);
  const maxY=Math.max(...a.slice(0,maxX+1),...b.slice(0,maxX+1),0.01);
  const bw=(W-pl-pr)/(maxX+1);
  const X=i=>pl+i*bw,Y=p=>pt+(H-pt-pb)*(1-p/maxY);
  let bars='';
  for(let i=0;i<=maxX;i++){
    const pa=a[i]||0,pb2=b[i]||0;
    if(pa>0)bars+=`<rect x="${X(i)+bw*.06}" y="${Y(pa)}" width="${bw*.44}" height="${Y(0)-Y(pa)}" fill="var(--accent)"><title>${i} dégâts : ${pct(pa)}</title></rect>`;
    if(pb2>0)bars+=`<rect x="${X(i)+bw*.5}" y="${Y(pb2)}" width="${bw*.44}" height="${Y(0)-Y(pb2)}" fill="var(--gold)"><title>${i} dégâts : ${pct(pb2)}</title></rect>`;
  }
  const step=Math.max(1,Math.ceil((maxX+1)/18));let ticks='';
  for(let i=0;i<=maxX;i+=step)ticks+=`<text x="${X(i)+bw/2}" y="${H-pb+16}" text-anchor="middle" font-size="12" fill="var(--muted)">${i}</text>`;
  let yt='';for(let j=0;j<=4;j++){const p=maxY*j/4;yt+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(p)}" y2="${Y(p)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(p)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(p*100)}%</text>`;}
  const hl=hp&&hp<=maxX?`<line x1="${X(hp)}" x2="${X(hp)}" y1="${pt}" y2="${Y(0)}" stroke="var(--danger)" stroke-width="2" stroke-dasharray="5 4"/><text x="${X(hp)+4}" y="${pt+10}" font-size="12" fill="var(--danger)">${hp} PV</text>`:'';
  $('#chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Répartition des dégâts sur un tour">${yt}${bars}${hl}${ticks}<text x="${(W+pl)/2}" y="${H-2}" text-anchor="middle" font-size="12" fill="var(--muted)">Dégâts infligés sur un tour</text></svg>`;
}
function onSandInput(el){

  Store.touch('sandbox');renderSandResults();
}

function spellScaled(x,slot){
  const D=derive(curBuild());const lvl=D.lvl;

  if(x.scale==='beams')count=lvl>=10?3:lvl>=5?2:1;
  const up=x.level>0?Math.max(0,(slot||x.level)-x.level):0;
  if(x.up&&up){const u=parseDice(x.up);for(let i=0;i<up;i++){u.dice.forEach(([n,s])=>{const f=d.dice.find(e=>e[1]===s);if(f)f[0]+=n;else d.dice.push([n,s]);});d.flat+=u.flat;}}
  count+=(+x.countUp||0)*up;
  return {dice:diceStr(d),count,D};
}

function attachMap(src){
  const vp=$('#mapview'),inner=$('#mapinner');if(!vp)return;const img=inner.querySelector('img');
  const setT=()=>{inner.style.transform=`translate(${MV.x}px,${MV.y}px) scale(${MV.z})`;inner.style.setProperty('--iz',1/MV.z);};
  MV.fit=()=>{const r=vp.getBoundingClientRect();MV.z=Math.min(r.width/MV.w,r.height/MV.h)||1;MV.x=(r.width-MV.w*MV.z)/2;MV.y=(r.height-MV.h*MV.z)/2;setT();};
  MV.zoomBy=f=>{const r=vp.getBoundingClientRect();const cx=r.width/2,cy=r.height/2;const nz=clamp(MV.z*f,.05,10);MV.x=cx-(cx-MV.x)*nz/MV.z;MV.y=cy-(cy-MV.y)*nz/MV.z;MV.z=nz;setT();};
  const size=(w,h)=>{MV.w=w;MV.h=h;inner.style.width=w+'px';inner.style.height=h+'px';if(!MV.fitted){MV.fit();MV.fitted=true;}else setT();};
  if(img){if(img.complete&&img.naturalWidth)size(img.naturalWidth,img.naturalHeight);else{img.onload=()=>size(img.naturalWidth,img.naturalHeight);img.onerror=()=>size(1600,1000);}}
  else size(1600,1000);
  let drag=null;
  vp.addEventListener('pointerdown',e=>{if(e.target.closest('.marker'))return;drag={sx:e.clientX,sy:e.clientY,x:MV.x,y:MV.y,moved:false};vp.setPointerCapture(e.pointerId);});
  vp.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.abs(dx)+Math.abs(dy)>5)drag.moved=true;if(drag.moved){MV.x=drag.x+dx;MV.y=drag.y+dy;setT();}});
  vp.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;if(!d.moved&&MV.mode==='add'){const r=inner.getBoundingClientRect();const x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;if(x>=0&&x<=1&&y>=0&&y<=1)addMarker(x,y);}});
  vp.addEventListener('pointercancel',()=>{drag=null;});
  vp.addEventListener('dblclick',e=>{const b=e.target.closest('.marker');if(!b)return;const k=curMap().markers.find(x=>x.id===b.dataset.id);if(k&&k.sub)enterMap(k.sub);});
  vp.addEventListener('wheel',e=>{e.preventDefault();const r=vp.getBoundingClientRect();const cx=e.clientX-r.left,cy=e.clientY-r.top;const nz=clamp(MV.z*(e.deltaY<0?1.15:1/1.15),.05,10);MV.x=cx-(cx-MV.x)*nz/MV.z;MV.y=cy-(cy-MV.y)*nz/MV.z;MV.z=nz;setT();},{passive:false});
}
function enterMap(id){if(!S.maps.find(m=>m.id===id))return;MV.map=id;MV.fitted=false;MV.sel=null;MV.mode='view';renderCartes();}
function addMarker(x,y){
  const m=curMap();const k={id:uid(),x:+x.toFixed(4),y:+y.toFixed(4),type:MV.newType,title:MK[MV.newType][1],text:'',npc:null};
  m.markers.push(k);MV.sel=k.id;MV.mode='view';MV.filter.add(k.type);
  Store.touch('maps');
  const b=$('[data-act="map-mode"]');if(b){b.setAttribute('aria-pressed','false');b.textContent='Placer un repère';}
  $('#mapview').classList.remove('adding');
  renderMarkers();renderMkPanel();setTimeout(()=>{const t=$('[data-mk="title"]');if(t){t.focus();t.select();}},20);
}
async function uploadMap(e){
  const f=e.target.files[0];if(!f||!Store.assets)return;
  try{const r=await Store.assets.upload(f);const m=curMap();m.img=r.id;m.url=r.url;MV.fitted=false;Store.touch('maps');renderCartes();}

}
function onMkInput(el){
  const k=curMap().markers.find(x=>x.id===MV.sel);if(!k)return;

  $('#notelist').innerHTML=list.length?list.map(n=>`<li><button data-act="note-open" data-id="${n.id}" aria-current="${n.id===NV.sel}"><span class="t">${esc(n.title||'Sans titre')}</span><span class="s">${[n.act?'Acte '+n.act:'',...(n.npcs||[]).map(npcName)].filter(Boolean).map(esc).join(', ')}</span></button></li>`).join(''):'<li class="empty-state">Aucune note pour l’instant.</li>';
}
function renderNoteEditor(){
  const E=$('#noteed');const n=S.notes.find(x=>x.id===NV.sel);
  if(!n){E.innerHTML='<p class="empty-state">Choisis une note à gauche, ou crée-en une.</p>';return;}
  const mk=n.marker?allMarkers().find(x=>x.id===n.marker.id):null;
  E.innerHTML=`<div class="stack">
    <input class="titleinput" data-n="title" data-fk="nt" value="${esc(n.title)}" placeholder="Titre" aria-label="Titre de la note">
    <div class="row"><label class="field">Acte<select data-n="act">${opt('','—',n.act)}${[1,2,3].map(a=>opt(a,'Acte '+a,n.act)).join('')}</select></label>
    <label class="field" style="flex:1">Mots-clés (séparés par des virgules)<input data-n="tags" data-fk="ntg" value="${esc((n.tags||[]).join(', '))}"></label></div>
    <textarea data-n="text" data-fk="nx" style="min-height:16em" placeholder="Ce que tu as appris…">${esc(n.text)}</textarea>
    <div><span class="small muted">Personnages et monstres liés</span><div>${(n.npcs||[]).map(id=>`<span class="linkchip"><button class="ghost" style="padding:0" data-act="npc-open" data-id="${id}">${esc(npcName(id))}</button><button data-act="note-unlink" data-id="${id}" aria-label="Retirer le lien">✕</button></span>`).join('')||'<span class="small muted">aucun</span>'}</div>
      <div class="row" style="margin-top:.4rem"><input id="linkname" list="npcnames" placeholder="Nom d’un PNJ ou monstre" aria-label="Nom à lier"><datalist id="npcnames">${S.npcs.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist><button data-act="note-link">Lier</button><span class="small muted">Un nouveau nom crée sa fiche.</span></div></div>
    <label class="field">Repère lié<select data-n="marker">${opt('','Aucun',mk?mk.id:'')}${S.maps.map(m=>m.markers.length?`<optgroup label="${esc(m.name)}">${m.markers.map(k=>opt(k.id,MK[k.type][0]+' '+k.title,mk?mk.id:'')).join('')}</optgroup>`:'').join('')}</select></label>
    <div class="row">${mk?`<button data-act="mk-goto" data-id="${mk.id}">Voir sur la carte</button>`:''}<span style="flex:1"></span><button class="danger" data-act="note-del">Supprimer la note</button></div>
  </div>`;
}
function onNoteInput(el){
  const n=S.notes.find(x=>x.id===NV.sel);if(!n)return;const f=el.dataset.n;
  if(f==='tags')n.tags=el.value.split(',').map(s=>s.trim()).filter(Boolean);
  else if(f==='marker'){const k=allMarkers().find(x=>x.id===el.value);n.marker=k?{map:k.map.id,id:k.id}:null;}
  else if(f==='act')n.act=el.value?+el.value:'';
  else n[f]=el.value;
  n.updated=Date.now();Store.touch('notes');renderNoteList();
  if(f==='marker')renderNoteEditor();
}
function linkNpcToNote(){
  const n=S.notes.find(x=>x.id===NV.sel);const name=($('#linkname').value||'').trim();if(!n||!name)return;
  let p=S.npcs.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!p){p=newNpc(name);S.npcs.push(p);Store.touch('npcs');}
  n.npcs=n.npcs||[];if(!n.npcs.includes(p.id))n.npcs.push(p.id);n.updated=Date.now();
  Store.touch('notes');renderNoteEditor();renderNoteList();
}

/* =========================================================
   PNJ & MONSTRES

const PV={sel:null,q:'',kind:''};
function newNpc(name){return {id:uid(),name:name||'Nouvelle fiche',kind:'pnj',att:'neutre',act:'',place:'',ac:'',hp:'',res:[],imm:[],vul:[],saves:blankSaves(),desc:''};}
function renderPnj(){
  if(PV.sel&&!S.npcs.find(n=>n.id===PV.sel))PV.sel=null;
  $('#v-pnj').innerHTML=`<h2>PNJ & monstres</h2>
  <p class="lead">Les fiches se remplissent toutes seules avec les notes du carnet et les repères de carte qui les citent.</p>
  <div class="split">
    <div class="panel">
      <div class="row"><button class="primary" data-act="npc-new">Nouvelle fiche</button><button data-act="data-io">Importer depuis bg3.wiki</button></div>
      <div class="row" style="margin-top:.6rem"><input type="search" id="pq" value="${esc(PV.q)}" placeholder="Rechercher…" style="flex:1" aria-label="Rechercher une fiche"><select id="pkind" aria-label="Filtrer par type">${opt('','Tous',PV.kind)}${Object.entries(NPCK).map(([k,n])=>opt(k,n,PV.kind)).join('')}</select></div>
      <ul class="list" id="npclist"></ul>
    </div>
    <div class="panel" id="npced"></div>
  </div>`;
  renderNpcList();renderNpcEditor();
}
function renderNpcList(){
  const q=PV.q.toLowerCase();
  const list=S.npcs.filter(n=>(!PV.kind||n.kind===PV.kind)&&(!q||(n.name+' '+n.place+' '+n.desc).toLowerCase().includes(q))).sort((a,b)=>a.name.localeCompare(b.name,'fr'));
  $('#npclist').innerHTML=list.length?list.map(n=>{const c=S.notes.filter(x=>(x.npcs||[]).includes(n.id)).length;return `<li><button data-act="npc-open" data-id="${n.id}" aria-current="${n.id===PV.sel}"><span class="t">${thumb('npc:'+n.id)}${esc(n.name)}<span class="kindtag">${NPCK[n.kind]||''}</span></span><span class="s">${[n.act?'Acte '+n.act:'',n.place,c?c+' note'+(c>1?'s':''):''].filter(Boolean).map(esc).join(', ')}</span></button></li>`;}).join(''):'<li class="empty-state">Aucune fiche. Importe les créatures du wiki avec le bouton ci-dessus, ou crée-les depuis le carnet.</li>';
}
function renderNpcEditor(){
  const E=$('#npced');const n=S.npcs.find(x=>x.id===PV.sel);
  if(!n){E.innerHTML='<p class="empty-state">Choisis une fiche à gauche.</p>';return;}
  const notes=S.notes.filter(x=>(x.npcs||[]).includes(n.id));
  const mks=allMarkers().filter(k=>k.npc===n.id);
  E.innerHTML=`<div class="stack">
    <input class="titleinput" data-p="name" data-fk="pn" value="${esc(n.name)}" aria-label="Nom">
    ${n.stats?`<p class="small muted" style="margin:0">${[n.stats.level?'Niveau '+n.stats.level:'',n.stats.type,n.stats.xp?n.stats.xp+' XP':''].filter(Boolean).map(esc).join(', ')}<br>${ABK.map(a=>`${ABS[a]} ${n.stats.abil[a]}`).join('  ')}${n.wikiPage?` <a href="${wikiUrl(n.wikiPage)}" target="_blank" rel="noopener">fiche bg3.wiki</a>`:''}</p>`:''}
    <div class="formgrid">
      <label>Type<select data-p="kind">${Object.entries(NPCK).map(([k,x])=>opt(k,x,n.kind)).join('')}</select></label>
      <label>Attitude<select data-p="att">${Object.entries(ATT).map(([k,x])=>opt(k,x,n.att)).join('')}</select></label>
      <label>Acte<select data-p="act">${opt('','—',n.act)}${[1,2,3].map(a=>opt(a,'Acte '+a,n.act)).join('')}</select></label>
      <label>Lieu<input data-p="place" data-fk="pp" value="${esc(n.place)}"></label>
      <label>Classe d’armure<input type="number" data-p="ac" data-fk="pac" value="${esc(n.ac)}"></label>
      <label>Points de vie<input type="number" data-p="hp" data-fk="php" value="${esc(n.hp)}"></label>
    </div>
    ${imgZone('npc:'+n.id)}
    <details><summary>Jets de sauvegarde</summary><div class="row" style="margin-top:.5rem">${ABK.map(a=>`<label class="field">${ABS[a]}<input type="number" data-ps="${a}" data-fk="ps${a}" value="${+((n.saves||{})[a])||0}" style="width:4.2em"></label>`).join('')}</div></details>
    <details${(n.res.length+n.imm.length+n.vul.length)?' open':''}><summary>Résistances, immunités, vulnérabilités</summary>
      ${[['res','Résistances'],['imm','Immunités'],['vul','Vulnérabilités']].map(([k,t])=>`<p class="small muted" style="margin:.6rem 0 .2rem">${t}</p><div class="checks">${DTYPES.map(d=>`<label><input type="checkbox" data-pl="${k}" value="${d}"${n[k].includes(d)?' checked':''}>${d}</label>`).join('')}</div>`).join('')}
    </details>
    <label class="field">Actions, réactions et effets<textarea data-p="actions" data-fk="pa" placeholder="Ex. : Attaque multiple (2 coups), Réaction : riposte, Aura de peur…">${esc(n.actions||'')}</textarea></label>
    <label class="field">Description, tactique, butin<textarea data-p="desc" data-fk="pd">${esc(n.desc)}</textarea></label>
    <div class="row"><button data-act="npc-target">Utiliser comme cible dans le bac à sable</button><span style="flex:1"></span><button class="danger" data-act="npc-del">Supprimer la fiche</button></div>
    <h3 style="margin-top:1rem">Notes du carnet</h3>
    ${notes.length?`<ul class="backlinks" style="list-style:none;padding:0">${notes.map(x=>`<li><button class="ghost" style="padding:0;font-weight:500" data-act="note-open" data-id="${x.id}">${esc(x.title||'Sans titre')}</button><div class="small muted">${esc((x.text||'').slice(0,180))}${(x.text||'').length>180?'…':''}</div></li>`).join('')}</ul>`:'<p class="small muted">Aucune note ne cite encore cette fiche.</p>'}
    ${(()=>{const L=S.lore.filter(x=>(x.npcs||[]).includes(n.id));return `<h3>Dans la bibliothèque</h3>${L.length?L.map(x=>`<button class="small" data-act="lore-open" data-id="${x.id}">📖 ${esc(x.title||'Sans titre')}</button>`).join(' '):'<p class="small muted">Aucun écrit lié.</p>'}`;})()}
    ${(()=>{const L=S.videos.filter(x=>(x.npcs||[]).includes(n.id));return L.length?`<h3>Vidéos</h3>${videoBacklinks('npcs',n.id)}`:'';})()}
    <h3>Sur les cartes</h3>
    ${mks.length?mks.map(k=>`<button class="small" data-act="mk-goto" data-id="${k.id}">${MK[k.type][0]} ${esc(k.title)} (${esc(k.map.name)})</button>`).join(' '):'<p class="small muted">Aucun repère lié.</p>'}
  </div>`;
}
function onNpcInput(el){
  const n=S.npcs.find(x=>x.id===PV.sel);if(!n)return;
  if(el.dataset.ps){n.saves=n.saves||blankSaves();n.saves[el.dataset.ps]=+el.value||0;}
  else if(el.dataset.pl){const L=n[el.dataset.pl];const i=L.indexOf(el.value);if(el.checked&&i<0)L.push(el.value);if(!el.checked&&i>=0)L.splice(i,1);}
  else{const f=el.dataset.p;n[f]=['ac','hp','act'].includes(f)?(el.value===''?'':+el.value):el.value;}
  Store.touch('npcs');renderNpcList();
}

function slotsFor(it){
  const t=(String(it.name)+' '+(it.en||'')+' '+(it.wtype||'')).toLowerCase();
  if(/\btorch|torche/.test(t))return it.w?['torch','mainhand','offhand']:['torch'];
  if(/instrument|\blute\b|luth|flute|flûte|drum|tambour|lyre|violin|viole|bagpipe|cornemuse|shawm|harp|harpe|horn of/.test(t)&&!it.w&&!it.a)return['instrument'];
  switch(it.cat){
    case 'Casque':return['head'];case 'Cape':return['cloak'];case 'Armure':return['body'];case 'Gants':return['hands'];
    case 'Bottes':return['feet'];case 'Amulette':return['neck'];case 'Anneau':return['ring1','ring2'];case 'Bouclier':return['offhand'];
    case 'Élixir':return['elixir'];
    case 'Arme':{if(!it.w)return[];const p=it.w.props||[];if(it.w.ranged)return p.includes('light')?['rangedMain','rangedOff']:['rangedMain'];if(p.includes('twohanded'))return['mainhand'];return['mainhand','offhand'];}
  }
  return[];
}

function newEnemy(n){
  const e={id:uid(),npc:null,name:'Cible d’entraînement',ac:13,hp:30,saves:blankSaves(),saveMode:'normal',res:[],imm:[],vul:[]};
  if(n)Object.assign(e,{npc:n.id,name:npcLabel(n),ac:+n.ac||10,hp:+n.hp||1,saves:{...blankSaves(),...(n.saves||{})},res:[...(n.res||[])],imm:[...(n.imm||[])],vul:[...(n.vul||[])]});
  return e;
}
function sbState(){
  const s=S.sandbox;
  if(!s.v2)s.v2={char:null,mode:'melee',weapon:'',spell:'',slot:0,attacks:'',adv:'normal',type:'',extra:'',atkOv:'',dmgOv:'',buffs:null,enemies:[],sel:null,showAll:false};
  const v=s.v2;
  if(!v.enemies.length)v.enemies.push(newEnemy());
  if(!v.enemies.find(e=>e.id===v.sel))v.sel=v.enemies[0].id;
  if(!S.builds.find(b=>b.id===v.char))v.char=S.current;
  return v;
}
const sbBuild=()=>S.builds.find(b=>b.id===sbState().char)||curBuild();
function sbRow(v){
  const b=sbBuild();const slot=v.mode==='ranged'?'rangedMain':'mainhand';let b2=b;
  const it=v.weapon?ITEMS.get(v.weapon):null;
  if(it&&it.w){const eq={...(b.equip||{}),[slot]:v.weapon};if(slot==='mainhand'&&(it.w.props||[]).includes('twohanded'))delete eq.offhand;b2={...b,equip:eq};}
  const D=derive(b2);return {row:D.attacks.find(a=>a.slot===slot),D};
}
function sbResetBuffs(){
  const v=sbState();const b=sbBuild();const {row}=sbRow(v);
  v.buffs={lucky:!!(RACES[b.race]||{}).lucky,gwf:!!(row&&row.gwf),savage:!!(row&&row.savage),gwmFeat:!!(row&&row.powerFeat),power:false,rage:!!(row&&row.rage),bless:false,hex:false,mark:false};
}
function sbCfg(){
  const v=sbState();const B=v.buffs||{};let cfg,info;
  if(v.mode==='spell'){
    const x=SPELLS.get(v.spell);const D=derive(sbBuild());const c=D.casters[0];
    if(!x)return {cfg:null,info:'Choisis un sort dans la liste.'};
    if(x.kind==='rider')return {cfg:null,info:`${x.name} s’ajoute aux coups d’arme : passe en corps à corps ou à distance et coche le buff correspondant.`};
    if(!x.dice||x.kind==='none')return {cfg:null,info:`${x.name} n’inflige pas de dégâts directs.`};
    const slot=x.level>0?Math.max(x.level,+v.slot||x.level):0;
    const d=parseDice(x.dice);let count=+x.count||1;
    if(x.level===0&&x.scale==='dice'){const k=D.lvl>=10?3:D.lvl>=5?2:1;d.dice=d.dice.map(([n,s])=>[n*k,s]);}
    if(x.scale==='beams')count=D.lvl>=10?3:D.lvl>=5?2:1;
    const up=x.level>0?slot-x.level:0;
    if(x.up&&up){const u=parseDice(x.up);for(let i=0;i<up;i++){u.dice.forEach(([n,s])=>{const f=d.dice.find(e=>e[1]===s);if(f)f[0]+=n;else d.dice.push([n,s]);});d.flat+=u.flat;}}
    count+=(+x.countUp||0)*up;
    cfg={...newCfg(''),kind:x.kind==='attack'?'spellatk':x.kind,atk:c?c.atk:0,atkDie:B.bless?'1d4':'',mode:v.adv,lucky:!!B.lucky,dc:c?c.dc:10,saveAb:x.save||'dex',onSave:x.onSave||'half',weapon:diceStr(d),wtype:v.type||x.dtype||'force',attacks:+v.attacks||count,extra:v.extra||'',crit:20};
    info=`${x.name}${slot?' au niveau '+slot:''} : ${cfg.kind==='save'?`DD ${cfg.dc}, sauvegarde de ${ABL[cfg.saveAb]}, ${cfg.onSave==='half'?'moitié des dégâts si elle réussit':'rien si elle réussit'}`:cfg.kind==='auto'?'touche automatiquement':`attaque ${sgn(cfg.atk)}${B.bless?' + 1d4':''}`}, ${cfg.attacks>1?cfg.attacks+' × ':''}${cfg.weapon} ${cfg.wtype}${c?'':'. Ce personnage n’a pas de classe de lanceur : DD et attaque à ajuster à la main.'}`;
  }else{
    const {row}=sbRow(v);
    if(!row)return {cfg:null,info:v.mode==='ranged'?'Pas d’arme à distance : équipe-en une sur le personnage, ou choisis-en une ci-dessus.':'Pas d’arme de corps à corps : équipe-en une sur le personnage, ou choisis-en une ci-dessus.'};
    const flat=row.flat+(B.rage?row.rage:0);
    const extra=[row.extra,B.hex?'1d6 nécrotique':'',B.mark?'1d6 '+row.dtype:'',v.extra].filter(Boolean).join(', ');
    cfg={...newCfg(''),kind:'weapon',atk:row.toHit,atkDie:B.bless?'1d4':'',mode:v.adv,lucky:!!B.lucky,crit:row.crit,attacks:+v.attacks||row.attacks,weapon:row.dice+(flat?sgn(flat).replace('−','-'):''),wtype:v.type||row.dtype,extra,once:row.sneak?row.sneak+'d6':'',gwf:!!B.gwf,savage:!!B.savage,powerFeat:!!B.gwmFeat,power:!!(B.gwmFeat&&B.power)};
    info=`${row.name} : toucher ${sgn(cfg.atk-(cfg.power?5:0))}${B.bless?' + 1d4':''}, ${cfg.attacks} attaque${cfg.attacks>1?'s':''} de ${cfg.weapon}${cfg.power?'+10':''} ${cfg.wtype}${extra?' + '+extra:''}${cfg.once?', attaque sournoise '+cfg.once+' une fois par tour':''}${row.prof?'':'. Attention : arme non maîtrisée'}.`;
  }
  if(v.atkOv!==''&&v.atkOv!=null)cfg.atk=+v.atkOv;
  if(v.dmgOv)cfg.weapon=v.dmgOv;
  return {cfg,info};
}

ACT['sb-adv']=t=>{const v=sbState();v.adv=t.dataset.k;sbSave();$$('[data-act="sb-adv"]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.k===v.adv));renderSandResults();};
ACT['sb-en-sel']=t=>{const v=sbState();v.sel=t.dataset.id;sbSave();renderSandbox();};
ACT['sb-en-del']=t=>{const v=sbState();v.enemies=v.enemies.filter(x=>x.id!==t.dataset.id);sbSave();renderSandbox();};
ACT['sb-en-add']=()=>{const v=sbState();const e=newEnemy();e.name='Ennemi '+(v.enemies.length+1);v.enemies.push(e);v.sel=e.id;sbSave();renderSandbox();setTimeout(()=>{const i=$('#sb-en-search');if(i)i.focus();},30);};
ACT['sb-weapon-reset']=()=>{const v=sbState();v.weapon='';sbResetBuffs();sbSave();renderSandbox();};
ACT_CHANGE['sb-en-pick']=el=>{const v=sbState();const q=el.value.trim().toLowerCase();if(!q)return;const n=S.npcs.find(x=>npcLabel(x).toLowerCase()===q)||S.npcs.find(x=>x.name.toLowerCase()===q);if(!n){toast('Aucune fiche à ce nom.');return;}const i=v.enemies.findIndex(x=>x.id===v.sel);const ne=newEnemy(n);ne.id=v.sel;v.enemies[i]=ne;sbSave();renderSandbox();};
ACT_CHANGE['sb-weapon']=el=>{const v=sbState();const q=el.value.trim().toLowerCase();if(!q){v.weapon='';}else{const it=[...ITEMS.values()].find(i=>i.w&&i.name.toLowerCase()===q&&(v.mode==='ranged')===!!i.w.ranged);if(!it){toast('Arme introuvable.');return;}v.weapon=it.id;}sbResetBuffs();sbSave();renderSandbox();};
ACT_CHANGE['sb-spell']=el=>{const v=sbState();const q=el.value.trim().toLowerCase();const x=[...SPELLS.values()].find(s=>s.name.toLowerCase()===q);if(!x){toast('Sort introuvable.');return;}v.spell=x.id;v.slot=x.level;v.attacks='';sbSave();renderSandbox();};
document.addEventListener('input',e=>{
  const el=e.target;if(el.tagName==='SELECT'||el.type==='checkbox')return;
  const v=S.sandbox.v2;if(!v)return;
  if(el.dataset.sbv){v[el.dataset.sbv]=el.value;sbSave();renderSandResults();}
  else if(el.dataset.en){const en=v.enemies.find(x=>x.id===v.sel);en[el.dataset.en]=Math.max(el.dataset.en==='hp'?1:0,+el.value||0);sbSave();renderSandResults();}
  else if(el.dataset.ens){const en=v.enemies.find(x=>x.id===v.sel);en.saves[el.dataset.ens]=+el.value||0;sbSave();renderSandResults();}
});
document.addEventListener('change',e=>{
  const el=e.target;const v=S.sandbox.v2;if(!v)return;
  if(el.dataset.sbv&&el.tagName==='SELECT'){v[el.dataset.sbv]=el.value;sbSave();renderSandResults();}
  else if(el.dataset.sbb){v.buffs[el.dataset.sbb]=el.checked;if(el.dataset.sbb==='gwmFeat'){if(!el.checked)v.buffs.power=false;sbSave();renderSandbox();return;}sbSave();renderSandResults();}
  else if(el.dataset.en2){const en=v.enemies.find(x=>x.id===v.sel);en[el.dataset.en2]=el.value;sbSave();renderSandResults();}
  else if(el.dataset.enl){const en=v.enemies.find(x=>x.id===v.sel);const L=en[el.dataset.enl];const i=L.indexOf(el.value);if(el.checked&&i<0)L.push(el.value);if(!el.checked&&i>=0)L.splice(i,1);sbSave();renderSandResults();}
});
function sendToSandbox(i){
  const b=curBuild();const D=derive(b);const a=D.attacks[i];if(!a)return;const v=sbState();
  v.char=b.id;v.mode=a.slot.startsWith('ranged')?'ranged':'melee';v.weapon=(a.slot==='offhand'||a.slot==='rangedOff')?b.equip[a.slot]:'';v.attacks='';v.atkOv='';v.dmgOv='';
  sbResetBuffs();sbSave();location.hash='#sandbox';
}
function sendSpell(id){
  const x=SPELLS.get(id);if(!x)return;const v=sbState();
  v.char=S.current;v.mode='spell';v.spell=id;v.slot=$('#sp-slot')?+$('#sp-slot').value:x.level;v.attacks='';v.atkOv='';v.dmgOv='';
  sbResetBuffs();sbSave();closeDlg();location.hash='#sandbox';
}
function riderSpell(id){
  const x=SPELLS.get(id);if(!x)return;const v=sbState();if(!v.buffs)sbResetBuffs();
  if(v.mode==='spell')v.mode='melee';
  if(/hex|maléfice/i.test(x.en+x.name))v.buffs.hex=true;
  else if(/hunter|chasseur/i.test(x.en+x.name))v.buffs.mark=true;
  else{const {dice}=spellScaled(x,$('#sp-slot')?+$('#sp-slot').value:x.level);const add=`${dice} ${x.dtype||''}`.trim();v.extra=v.extra?v.extra+', '+add:add;}
  sbSave();closeDlg();toast(`${x.name} ajouté aux coups d’arme.`);location.hash='#sandbox';
}
ACT['npc-target']=()=>{const n=S.npcs.find(x=>x.id===PV.sel);if(!n)return;const v=sbState();const e=newEnemy(n);v.enemies.push(e);v.sel=e.id;sbSave();location.hash='#sandbox';};
