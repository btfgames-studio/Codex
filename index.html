MV.act=1;
const mapAct=m=>(m.act===''||m.act==null)?0:+m.act;
function enterMap(id){const m=S.maps.find(x=>x.id===id);if(!m)return;MV.act=mapAct(m);MV.map=id;MV.fitted=false;MV.sel=null;MV.mode='view';if(cur==='cartes')renderCartes();}
ACT['map-pick']=t=>enterMap(t.dataset.id);
ACT['map-enter']=t=>enterMap(t.dataset.id);
ACT['map-act']=t=>{MV.act=+t.dataset.a;MV.map=null;MV.sel=null;MV.fitted=false;renderCartes();};
ACT['mk-goto']=t=>{const k=allMarkers().find(x=>x.id===t.dataset.id);if(!k)return;MV.act=mapAct(k.map);MV.map=k.map.id;MV.sel=k.id;MV.fitted=false;MV.filter.add(k.type);if(cur==='cartes')renderCartes();else location.hash='#cartes';};
function renderCartes(){
  ensureDefaults();
  const acts=[1,2,3];if(S.maps.some(m=>!mapAct(m)))acts.push(0);
  if(!acts.includes(MV.act))MV.act=1;
  const inAct=S.maps.filter(m=>mapAct(m)===MV.act);
  if(!curMap()||mapAct(curMap())!==MV.act){MV.map=inAct[0]?inAct[0].id:null;MV.fitted=false;MV.sel=null;}
  const m=curMap();
  const tabs=`<div class="subtabs">${acts.map(a=>`<button data-act="map-act" data-a="${a}" aria-pressed="${a===MV.act}">${a?'Acte '+a:'Sans acte'}</button>`).join('')}</div>`;
  if(!m){$('#v-cartes').innerHTML=tabs+`<div class="panel empty-state"><p>Aucune carte pour cet acte.</p><button class="primary" data-act="map-new">Ajouter une carte</button></div>`;return;}
  const src=m.img?blobUrl(m.img):(m.url||null);
  const kids=id=>inAct.filter(x=>x.parent&&x.parent.map===id);
  const roots=inAct.filter(x=>!x.parent||!inAct.find(y=>y.id===x.parent.map));
  const node=(x,d)=>`<li><button data-act="map-pick" data-id="${x.id}" aria-current="${x.id===m.id}" style="padding-left:${.6+d*1.1}rem">${d?'↳ ':''}${esc(x.name)} <span class="muted small">(${x.markers.length})</span></button></li>`+kids(x.id).map(c=>node(c,d+1)).join('');
  $('#v-cartes').innerHTML=tabs+`
  <div class="maps-grid">
    <aside class="panel">
      <h3>${MV.act?'Acte '+MV.act:'Sans acte'}</h3>
      <ul class="maplist">${roots.map(r=>node(r,0)).join('')}</ul>
      <button class="small primary" data-act="map-new">Ajouter une carte</button>
      <p class="small muted" style="margin-top:1rem">Une sous-carte est rattachée à une carte parente par ses coordonnées X et Y. Un repère 🚪 est créé à cet endroit : double-clique dessus pour entrer.</p>
    </aside>
    <div>
      <p class="small" style="margin:0 0 .4rem">${mapCrumbs(m)}</p>
      <div class="maptools">
        <button data-act="map-mode" aria-pressed="${MV.mode==='add'}">${MV.mode==='add'?'Clique sur la carte pour placer le repère':'Placer un repère'}</button>
        <select data-act-change="mk-newtype" aria-label="Type du prochain repère">${Object.entries(MK).map(([k,[i,n]])=>opt(k,i+' '+n,MV.newType)).join('')}</select>
        <span style="flex:1"></span>
        <button data-act="map-zoom" data-z="1.25" aria-label="Zoomer">+</button><button data-act="map-zoom" data-z="0.8" aria-label="Dézoomer">−</button><button data-act="map-fit">Recadrer</button>
      </div>
      <div class="mapview${MV.mode==='add'?' adding':''}" id="mapview"><div class="mapinner" id="mapinner">${src?`<img src="${esc(src)}" alt="${esc(m.name)}">`:`<div class="placeholder">${esc(m.name)}<br><span style="font-size:22px">Ajoute une capture d’écran de cette carte avec le bouton sous la carte.</span></div>`}<div class="mklayer" id="mklayer"></div></div></div>
      <div class="row" style="justify-content:space-between;margin-top:.3rem"><span class="small muted" id="coords">Survole la carte pour voir les coordonnées</span></div>
      <div class="chips" aria-label="Filtrer les repères">${Object.entries(MK).map(([k,[i,n]])=>`<button class="chip" data-act="mk-filter" data-k="${k}" aria-pressed="${MV.filter.has(k)}">${i} ${n}</button>`).join('')}</div>
      <div class="row" style="margin-top:.8rem">
        ${Store.assets?`<label class="btn">${src?'Changer l’image':'Ajouter la capture d’écran'}<input type="file" accept="image/*" id="map-file" hidden></label>`:'<span class="small muted">L’import d’images fonctionne dans la page publiée, quand tu en es le propriétaire.</span>'}
        <button data-act="map-rename">Renommer</button>
        ${m.ext?`<a class="btn" href="${esc(m.ext)}" target="_blank" rel="noopener">🗺 Ouvrir la carte interactive</a>`:''}<button data-act="map-ext">${m.ext?'Changer le lien interactif':'Lier une carte interactive'}</button>
        <button class="danger" data-act="map-del"${S.maps.length<2?' disabled':''}>Supprimer la carte</button>
      </div>
    </div>
    <aside class="panel" id="mkpanel"></aside>
  </div>`;
  renderMarkers();renderMkPanel();attachMap(src);
  const fi=$('#map-file');if(fi)fi.addEventListener('change',uploadMap);
  const vp=$('#mapview'),inner=$('#mapinner');
  vp.addEventListener('pointermove',ev=>{const r=inner.getBoundingClientRect();const x=(ev.clientX-r.left)/r.width*100,y=(ev.clientY-r.top)/r.height*100;$('#coords').textContent=(x>=0&&x<=100&&y>=0&&y<=100)?`Coordonnées : X ${fmt(x)}  Y ${fmt(y)}`:'Hors de la carte';});
}
function mapNewDialog(pre){
  pre=pre||{name:'',act:MV.act,parent:'',x:'',y:''};
  const inAct=S.maps.filter(m=>mapAct(m)===(+pre.act||0));
  openDlg('Ajouter une carte',`<form id="mapform" class="stack">
    <div class="formgrid">
      <label>Nom<input name="name" required value="${esc(pre.name)}" placeholder="Ex. : Ruines envahies"></label>
      <label>Acte<select name="act" id="mf-act">${[1,2,3].map(a=>opt(a,'Acte '+a,pre.act)).join('')}${opt(0,'Sans acte',pre.act)}</select></label>
      <label>Carte parente<select name="parent" id="mf-parent">${opt('','Aucune : carte principale',pre.parent)}${inAct.map(m=>opt(m.id,m.name,pre.parent)).join('')}</select></label>
    </div>
    <fieldset id="mf-coords"${pre.parent?'':' hidden'}><legend>Position sur la carte parente</legend>
      <div class="row"><label class="field">X (0 à 100)<input type="number" name="x" min="0" max="100" step="0.1" value="${esc(pre.x)}"></label>
      <label class="field">Y (0 à 100)<input type="number" name="y" min="0" max="100" step="0.1" value="${esc(pre.y)}"></label>
      <button type="button" data-act="map-pickpos">Choisir en cliquant sur la carte</button></div>
      <p class="small muted">X va de la gauche (0) à la droite (100), Y du haut (0) vers le bas (100). Les coordonnées s’affichent sous la carte quand tu la survoles.</p></fieldset>
    <label class="field">Capture d’écran de la carte<input type="file" name="img" accept="image/*"></label>
    ${MV.pendingFile?`<p class="small">Image déjà choisie : ${esc(MV.pendingFile.name)}</p>`:''}
    ${Store.assets?'':'<p class="small muted">L’import d’images fonctionne dans la page publiée ; tu pourras l’ajouter plus tard.</p>'}
    <div class="row"><button class="primary" type="submit">Créer la carte</button><button type="button" data-act="dlg-close">Annuler</button></div></form>`);
  const form=$('#mapform');
  $('#mf-parent').addEventListener('change',e=>{$('#mf-coords').hidden=!e.target.value;});
  $('#mf-act').addEventListener('change',()=>{const p=mapFormVals();p.parent='';mapNewDialog(p);});
  form.addEventListener('submit',async e=>{
    e.preventDefault();const p=mapFormVals();if(!p.name)return;
    const file=p.file||MV.pendingFile;
    const nm={id:uid(),name:p.name,act:+p.act||0,img:null,url:null,parent:null,markers:[]};
    if(file&&Store.assets){try{const r=await Store.assets.upload(file);nm.img=r.id;nm.url=r.url;}catch(err){toast('L’image n’a pas pu être envoyée ; tu pourras la rajouter.');}}
    if(p.parent){const pm=S.maps.find(x=>x.id===p.parent);if(pm){const k={id:uid(),x:clamp(+p.x||50,0,100)/100,y:clamp(+p.y||50,0,100)/100,type:'lieu',title:p.name,text:'',npc:null,sub:nm.id};pm.markers.push(k);nm.parent={map:pm.id,marker:k.id};MV.filter.add('lieu');}}
    S.maps.push(nm);MV.pendingFile=null;MV.pendingMap=null;Store.touch('maps');closeDlg();enterMap(nm.id);
  });
}
function mapFormVals(){const f=new FormData($('#mapform'));const img=f.get('img');return {name:String(f.get('name')||'').trim(),act:f.get('act'),parent:f.get('parent')||'',x:f.get('x')||'',y:f.get('y')||'',file:img&&img.size?img:null};}
ACT['map-new']=()=>{MV.pendingFile=null;mapNewDialog();};
ACT['map-pickpos']=()=>{
  const p=mapFormVals();if(!p.parent){toast('Choisis d’abord la carte parente.');return;}
  if(p.file)MV.pendingFile=p.file;MV.pendingMap=p;closeDlg();
  enterMap(p.parent);MV.pick=true;MV.mode='add';const vp=$('#mapview');if(vp)vp.classList.add('adding');
  toast('Clique sur la carte à l’endroit de la sous-carte.');
};
function addMarker(x,y){
  if(MV.pick){MV.pick=false;MV.mode='view';const vp=$('#mapview');if(vp)vp.classList.remove('adding');const p=MV.pendingMap||{};p.x=(x*100).toFixed(1);p.y=(y*100).toFixed(1);mapNewDialog(p);return;}
  const m=curMap();const k={id:uid(),x:+x.toFixed(4),y:+y.toFixed(4),type:MV.newType,title:MK[MV.newType][1],text:'',npc:null};
  m.markers.push(k);MV.sel=k.id;MV.mode='view';MV.filter.add(k.type);
  Store.touch('maps');
  const b=$('[data-act="map-mode"]');if(b){b.setAttribute('aria-pressed','false');b.textContent='Placer un repère';}
  $('#mapview').classList.remove('adding');
  renderMarkers();renderMkPanel();setTimeout(()=>{const t=$('[data-mk="title"]');if(t){t.focus();t.select();}},20);
}

const YV={sel:null,act:'',q:''};
const ytId=u=>{const m=String(u||'').match(/(?:youtu\.be\/|[?&]v=|shorts\/|embed\/|live\/)([\w-]{11})/);return m?m[1]:null;};
function vidThumb(x,cls){
  const own=imgSrc('vid:'+x.id);if(own)return `<img class="${cls}" src="${esc(own)}" alt="">`;
  const id=ytId(x.url);return id?`<img class="${cls}" data-yt src="https://i.ytimg.com/vi/${id}/mqdefault.jpg" alt="">`:`<span class="${cls} ytph" aria-hidden="true">▶</span>`;
}
function fixYtThumbs(root){$$('img[data-yt]',root||document).forEach(i=>{const bad=()=>{const s=document.createElement('span');s.className=i.className+' ytph';s.textContent='▶';s.setAttribute('aria-hidden','true');i.replaceWith(s);};if(i.complete&&!i.naturalWidth)bad();else i.addEventListener('error',bad,{once:true});});}
function videoBacklinks(field,id){
  const L=S.videos.filter(x=>(x[field]||[]).includes(id));if(!L.length)return'';
  return `<div style="margin-top:.6rem"><span class="small muted">Vidéos :</span> ${L.map(x=>`<button class="small" data-act="video-open" data-id="${x.id}">▶ ${x.act?'A'+x.act+' #'+x.order+' ':''}${esc(x.title||'Vidéo')}</button>`).join(' ')}</div>`;
}

  const d=clone(snap.data());const n=+d.chunks||1;this.nChunks[k]=n;this.sent[k+'#0']=JSON.stringify(snap.data());
  const rest=await Promise.all(Array.from({length:n-1},(_,i)=>this.ref(k,i+1).get()));
  rest.forEach((s2,i)=>{if(!s2.exists)throw new Error('morceau manquant');const c=s2.data();this.sent[k+'#'+(i+1)]=JSON.stringify(c);d.list=(d.list||[]).concat(clone(c.list||[]));});

  setSync('busy');syncText(`Chargement de tes données (0/${total})…`);
  const tmo=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('délai dépassé')),ms))]);
  await Promise.all(this.keys.map(async k=>{
    try{const d=await tmo(this.load(k),60000);if(d)this.unpack(k,d);this.loaded.add(k);if(!d)this.flush(k);}

let EC=null;
function adjacency(){
  if(EC)return EC;const A=new Map();
  const add=(a,b,src)=>{if(!a||!b||a===b)return;for(const [x,y] of [[a,b],[b,a]]){if(!A.has(x))A.set(x,new Map());const m=A.get(x);if(!m.has(y))m.set(y,[]);m.get(y).push(src);}};
  const re=/\[\[(\w+):([^|\]]+)\|[^\]]*\]\]/g;
  const tok=(r,t)=>{if(!t||t.indexOf('[[')<0)return;for(const m of String(t).matchAll(re))add(r,m[1]+':'+m[2],{kind:'text'});};
  S.notes.forEach(n=>{const r='note:'+n.id;(n.npcs||[]).forEach(i=>add(r,'npc:'+i,{kind:'field'}));if(n.marker)add(r,'marker:'+n.marker.id,{kind:'field'});tok(r,n.text);});
  S.lore.forEach(x=>{const r='lore:'+x.id;(x.items||[]).forEach(i=>add(r,'item:'+i,{kind:'field'}));(x.npcs||[]).forEach(i=>add(r,'npc:'+i,{kind:'field'}));(x.spells||[]).forEach(i=>add(r,'spell:'+i,{kind:'field'}));if(x.marker)add(r,'marker:'+x.marker.id,{kind:'field'});tok(r,x.text);});
  S.videos.forEach(x=>{const r='video:'+x.id;(x.items||[]).forEach(i=>add(r,'item:'+i,{kind:'field'}));(x.npcs||[]).forEach(i=>add(r,'npc:'+i,{kind:'field'}));(x.spells||[]).forEach(i=>add(r,'spell:'+i,{kind:'field'}));if(x.marker)add(r,'marker:'+x.marker.id,{kind:'field'});tok(r,x.notes);});
  S.maps.forEach(m=>m.markers.forEach(k=>{const r='marker:'+k.id;if(k.npc)add(r,'npc:'+k.npc,{kind:'field'});if(k.sub)add(r,'map:'+k.sub,{kind:'sub'});tok(r,k.text);}));
  S.npcs.forEach(n=>{tok('npc:'+n.id,n.desc);tok('npc:'+n.id,n.actions);});
  S.quests.forEach(q=>tok('quest:'+q.id,q.text));
  S.customItems.forEach(c=>{if(c.spell)add('item:'+c.id,'spell:'+c.spell,{kind:'field'});});
  S.links.forEach(l=>add(l.a,l.b,{kind:'link'}));
  return EC=A;
}
function neighbors(ref){const m=adjacency().get(ref);if(!m)return[];const out=[];for(const [r,srcs] of m){const e=ent(r);if(e)out.push({ref:r,srcs,e});}return out;}

/* ---------- textes enrichis ---------- */
const TOKRE=/\[\[(\w+):([^|\]]+)\|([^\]]*)\]\]/g;
function richHTML(text,editable){
  const s=String(text||'');let out='',last=0;
  for(const m of s.matchAll(TOKRE)){
    out+=esc(s.slice(last,m.index));const ref=m[1]+':'+m[2];const ok=!!ent(ref);
    out+=editable?`<span class="ref${ok?'':' broken'}" contenteditable="false" data-ref="${esc(ref)}" data-t="${esc(m[1])}">${esc(m[3])}</span>`
      :`<button type="button" class="ref${ok?'':' broken'}" data-act="ref-open" data-ref="${esc(ref)}" data-t="${esc(m[1])}">${esc(m[3])}</button>`;
    last=m.index+m[0].length;
  }
  return out+esc(s.slice(last));
}
const stripTok=t=>String(t||'').replace(TOKRE,'$3');
function serializeRich(el){
  let out='';
  const walk=n=>{for(const c of n.childNodes){
    if(c.nodeType===3)out+=c.nodeValue.replace(/\u00a0/g,' ');
    else if(c.nodeType===1){
      if(c.dataset&&c.dataset.ref)out+=`[[${c.dataset.ref}|${c.textContent.replace(/[\[\]|]/g,'')}]]`;
      else if(c.tagName==='BR')out+='\n';
      else if(c.tagName==='DIV'||c.tagName==='P'){if(out&&!out.endsWith('\n'))out+='\n';walk(c);}
      else walk(c);
    }}};
  walk(el);return out;
}
function richEditor(key,text,ph){
  return `<div class="richwrap"><div class="richtools"><button type="button" class="small" data-act="rich-link" data-key="${esc(key)}" title="Ctrl+K">🔗 Lier la sélection</button><span class="small muted">Sélectionne un mot, puis « Lier » (ou Ctrl+K). Clique sur un lien pour l’ouvrir.</span></div>
  <div class="rich" contenteditable="true" spellcheck="true" data-rich="${esc(key)}" data-ph="${esc(ph||'')}" role="textbox" aria-multiline="true">${richHTML(text,true)}</div></div>`;
}
function richSet(key,val){
  const [t,id,f]=key.split(':');
  if(t==='marker'){const fm=findMarker(id);if(fm){fm.k[f]=val;Store.touch('maps');}return;}
  const M={note:[S.notes,'notes',renderNoteList],lore:[S.lore,'lore',renderLoreList],npc:[S.npcs,'npcs',null],quest:[S.quests,'quests',renderQuestList],video:[S.videos,'videos',renderVidList]}[t];
  if(!M)return;const o=M[0].find(x=>x.id===id);if(!o)return;o[f]=val;o.updated=Date.now();Store.touch(M[1]);
  if(M[2]&&$('#'+{note:'notelist',lore:'lorelist',quest:'questlist',video:'vidlist'}[t]))M[2]();
}
const RT={};
function commitRich(ed,now){const key=ed.dataset.rich;clearTimeout(RT[key]);const go=()=>richSet(key,serializeRich(ed));if(now)go();else RT[key]=setTimeout(go,300);}
document.addEventListener('input',e=>{const ed=e.target.closest&&e.target.closest('.rich[data-rich]');if(ed)commitRich(ed);});
document.addEventListener('focusout',e=>{if(e.target.matches&&e.target.matches('.rich[data-rich]'))commitRich(e.target,true);});
document.addEventListener('paste',e=>{const ed=e.target.closest&&e.target.closest('.rich[data-rich]');if(!ed)return;const t=e.clipboardData&&e.clipboardData.getData('text/plain');if(t==null||t==='')return;e.preventDefault();e.stopImmediatePropagation();document.execCommand('insertText',false,t);},true);
document.addEventListener('keydown',e=>{const ed=e.target.closest&&e.target.closest('.rich[data-rich]');if(ed&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();ACT['rich-link']({dataset:{key:ed.dataset.rich}});}});
document.addEventListener('mousedown',e=>{if(e.target.closest&&e.target.closest('[data-act="rich-link"]'))e.preventDefault();});
let RE=null;
ACT['rich-link']=t=>{
  const key=t.dataset.key;const ed=$(`.rich[data-rich="${CSS.escape(key)}"]`);if(!ed)return;
  const sel=window.getSelection();let range=null;
  if(sel&&sel.rangeCount&&ed.contains(sel.getRangeAt(0).commonAncestorContainer))range=sel.getRangeAt(0).cloneRange();
  else{range=document.createRange();range.selectNodeContents(ed);range.collapse(false);}
  const txt=range.toString().trim();RE={key,range};
  const [st,sid]=key.split(':');
  openPicker(ref=>{closeDlg();insertRef(ref);},{title:txt?`Lier « ${txt} » à…`:'Insérer un lien vers…',query:txt,exclude:st+':'+sid});
};
function insertRef(ref){
  if(!RE)return;const {key,range}=RE;RE=null;
  const ed=$(`.rich[data-rich="${CSS.escape(key)}"]`);
  if(!ed||!ed.contains(range.startContainer)){toast('Le texte a changé entre-temps : refais la sélection.');return;}
  const e=ent(ref);const label=range.toString().replace(/[\[\]|]/g,'').trim()||(e?e.name:'lien');
  const span=document.createElement('span');span.className='ref';span.contentEditable='false';span.dataset.ref=ref;span.dataset.t=splitRef(ref)[0];span.textContent=label;
  range.deleteContents();range.insertNode(span);
  try{const sel=window.getSelection();const r2=document.createRange();r2.setStartAfter(span);r2.collapse(true);sel.removeAllRanges();sel.addRange(r2);}catch(err){}
  commitRich(ed,true);refreshLinks();
}

function hidePop(){const p=$('#refpop');if(p)p.remove();POP=null;}

    document.body.appendChild(p);p.style.left=Math.max(8,Math.min(window.innerWidth-p.offsetWidth-8,rect.left))+'px';p.style.top=(rect.bottom+6)+'px';return;}
  if(!(e.target.closest&&e.target.closest('#refpop')))hidePop();
});

const decEnt=s=>{if(typeof s!=='string'||s.indexOf('&')<0)return s;for(let i=0;i<2;i++)s=s.replace(/&(#x[0-9a-f]+|#\d+|amp|lt|gt|quot|apos|nbsp);/gi,(m,c)=>{c=c.toLowerCase();if(c[0]==='#'){const n=c[1]==='x'?parseInt(c.slice(2),16):parseInt(c.slice(1),10);return n?String.fromCodePoint(n):m;}return {amp:'&',lt:'<',gt:'>',quot:'"',apos:"'",nbsp:' '}[c];});return s;};
function fixEnt(list,fields){let n=0;for(const o of list){for(const f of fields){const v=o[f];if(typeof v==='string'&&v.indexOf('&')>=0){const d=decEnt(v);if(d!==v){o[f]=d;n++;}}}if(o.stats&&typeof o.stats.type==='string')o.stats.type=decEnt(o.stats.type);}return n;}

const STANDALONE=!(window.claude&&typeof window.claude.use==='function');
const BLOBS={};
function blobUrl(id){return STANDALONE?(BLOBS[id]||''):'/_blob/'+id;}
const IDB={
  open(){return this.p||(this.p=new Promise((res,rej)=>{const r=indexedDB.open('bg3codex',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));},
  async req(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv',mode);const q=fn(t.objectStore('kv'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});},
  get(k){return this.req('readonly',s=>s.get(k));},
  set(k,v){return this.req('readwrite',s=>s.put(v,k));},
  keys(){return this.req('readonly',s=>s.getAllKeys());}
};
{

function dataUrlToBlob(u){const [h,b]=String(u).split(',');const mime=(h.match(/data:([^;]+)/)||[])[1]||'application/octet-stream';const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime});}
const blobToDataUrl=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b);});
function usedBlobIds(){const s=new Set(Object.values(S.images||{}));S.maps.forEach(m=>{if(m.img)s.add(m.img);});return [...s].filter(Boolean);}

    <div class="row"><button class="primary" data-act="bk-merge">Fusionner (recommandé)</button><button class="danger" data-act="bk-replace">Tout remplacer</button><button data-act="dlg-close">Annuler</button></div>
    <p class="small" id="io-msg" role="status" style="margin-top:.6rem"></p>`),0);

async function applyBackup(o,merge){
  const msg=t=>{const m=$('#io-msg');if(m)m.textContent=t;};
  msg('Restauration en cours…');
  const remap={};
  for(const [id,u] of Object.entries(o.blobs||{})){
    try{const b=dataUrlToBlob(u);
      if(STANDALONE){await IDB.set('blob:'+id,b);BLOBS[id]=URL.createObjectURL(b);}
      else if(Store.assets){const r=await Store.assets.upload(new File([b],id+'.'+((b.type.split('/')[1])||'png'),{type:b.type}));remap[id]=r.id;}
    }catch(e){console.warn('image',id,e);}
  }
  const inc=clone(o);
  if(Object.keys(remap).length){
    if(inc.images&&inc.images.map)for(const k in inc.images.map)if(remap[inc.images.map[k]])inc.images.map[k]=remap[inc.images.map[k]];
    if(inc.maps&&inc.maps.list)inc.maps.list.forEach(m=>{if(remap[m.img]){m.img=remap[m.img];m.url=null;}});
  }
  for(const k of Store.keys){
    if(inc[k]==null)continue;
    if(!merge){Store.unpack(k,inc[k]);continue;}
    const curd=Store.pack(k),d=inc[k];
    if(Array.isArray(d.list)&&Array.isArray(curd.list)){
      const key=x=>x&&x.id!=null?'id:'+x.id:JSON.stringify(x);
      const m=new Map(curd.list.map(x=>[key(x),x]));for(const x of d.list)m.set(key(x),x);
      let list=[...m.values()];
      if(k==='maps'){
        const empty=x=>/^Acte \d$/.test(x.name)&&!x.markers.length&&!x.img&&!x.ext&&!x.parent&&!list.some(y=>y.parent&&y.parent.map===x.id);
        list=list.filter((x,i)=>!(empty(x)&&list.some((y,j)=>j!==i&&y.name===x.name&&(!empty(y)||j<i))));
      }
      if(k==='builds'&&curd.list.length===1&&d.list.length){const c=curd.list[0];const blank=c.name==='Nouveau personnage'&&!Object.keys(c.equip||{}).length;if(blank)list=list.filter(x=>x.id!==c.id||d.list.some(y=>y.id===c.id));}
      Store.unpack(k,{...curd,...d,list,current:curd.current||d.current});
    }else if(k==='images'){Store.unpack(k,{map:{...(curd.map||{}),...(d.map||{})}});}
    else if(k==='sandbox'){if(!curd.v2&&d.v2)Store.unpack(k,d);}
    else Store.unpack(k,d);
  }
  for(const k of Store.keys){Store.loaded.add(k);Store.touch(k);}

const GH={ready:false,applying:false,
  cfg(){try{return JSON.parse(localStorage.getItem('bg3codex:gh')||'null');}catch(e){return null;}},
  setCfg(c){localStorage.setItem('bg3codex:gh',JSON.stringify(c));},
  meta(){try{return JSON.parse(localStorage.getItem('bg3codex:ghmeta')||'{}');}catch(e){return {};}},
  setMeta(m){localStorage.setItem('bg3codex:ghmeta',JSON.stringify({...this.meta(),...m}));},
  url(c){return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${c.path.split('/').map(encodeURIComponent).join('/')}`;},
  headers(c,accept){return {Authorization:'Bearer '+c.token,Accept:accept||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};}
};
async function makeBackup(){
  const o={codex:'bg3',version:4,date:new Date().toISOString(),device:(GH.cfg()||{}).device||''};
  for(const k of Store.keys)o[k]=Store.pack(k);
  o.blobs={};
  for(const id of usedBlobIds()){
    try{let b=null;if(STANDALONE)b=await IDB.get('blob:'+id);else{const r=await fetch('/_blob/'+id);if(r.ok)b=await r.blob();}if(b)o.blobs[id]=await blobToDataUrl(b);}catch(e){}
  }
  return o;
}
function b64utf8(str){const bytes=new TextEncoder().encode(str);let bin='';const CH=0x8000;for(let i=0;i<bytes.length;i+=CH)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));return btoa(bin);}

function ghErr(r,j){
  if(r.status===401)return 'Jeton refusé : vérifie-le ou crée-en un nouveau.';
  if(r.status===403)return 'Accès refusé : le jeton doit avoir la permission « Contents : Read and write » sur ce dépôt.';
  if(r.status===404)return 'Dépôt introuvable : vérifie le propriétaire, le nom du dépôt et que le jeton y a accès.';
  if(r.status===409)return 'Conflit avec une autre sauvegarde en cours : réessaie.';
  if(r.status===422)return 'GitHub a refusé le fichier'+(j&&j.message?' ('+j.message+')':'')+'.';
  return 'Erreur GitHub '+r.status+(j&&j.message?' : '+j.message:'');
}
async function ghSha(c){
  const r=await fetch(GH.url(c)+'?ref='+encodeURIComponent(c.branch),{headers:GH.headers(c,'application/vnd.github.object+json'),cache:'no-store'});
  if(r.status===404)return null;const j=await r.json().catch(()=>null);if(!r.ok)throw new Error(ghErr(r,j));return j&&j.sha;
}
async function ghSave(silent){
  const c=GH.cfg();if(!c||!c.token){ghSettings();return;}
  const btn=$('#ghsave');if(btn){btn.disabled=true;btn.textContent='💾 Envoi…';}
  try{
    const o=await makeBackup();const content=b64utf8(JSON.stringify(o));
    for(let attempt=0;attempt<2;attempt++){
      const sha=await ghSha(c);
      const r=await fetch(GH.url(c),{method:'PUT',headers:{...GH.headers(c),'Content-Type':'application/json'},body:JSON.stringify({message:`Codex : sauvegarde ${c.device?'depuis '+c.device+' ':''}(${hhmm(o.date)})`,content,branch:c.branch,...(sha?{sha}:{})})});
      if(r.status===409&&!attempt)continue;
      const j=await r.json().catch(()=>null);if(!r.ok)throw new Error(ghErr(r,j));
      GH.setMeta({lastSync:o.date,dirty:false});setSync('ok');syncText('Enregistré sur GitHub, '+hhmm(o.date));
      if(!silent)toast('💾 Sauvegarde envoyée sur GitHub.');
      break;
    }
  }catch(e){console.warn(e);setSync('err');syncText('Échec de l’envoi sur GitHub');if(!silent)toast(e.message||'Échec de l’envoi sur GitHub.');}
  finally{if(btn){btn.disabled=false;btn.textContent='💾 Enregistrer';}}
}
async function ghFetchLatest(c){
  const r=await fetch(GH.url(c)+'?ref='+encodeURIComponent(c.branch),{headers:GH.headers(c,'application/vnd.github.raw+json'),cache:'no-store'});
  if(r.status===404)return null;if(!r.ok){const j=await r.json().catch(()=>null);throw new Error(ghErr(r,j));}

async function ghCheck(manual){

    const o=await ghFetchLatest(c);const m=GH.meta();
    if(!o||o.codex!=='bg3'){GH.ready=true;setSync('local');syncText('Aucune sauvegarde sur GitHub pour l’instant');if(manual)toast('Aucune sauvegarde sur GitHub pour l’instant.');return;}
    const newer=!m.lastSync||new Date(o.date)>new Date(m.lastSync);
    if(!newer){GH.ready=true;setSync('ok');syncText('À jour avec GitHub ('+hhmm(o.date)+')');if(manual)toast('Cet appareil est déjà à jour.');return;}
    if(m.dirty&&!manual){

    }

async function ghApply(o){

const SRV={sel:0,list:[]};
function snippet(text,words){const t=stripTok(text).replace(/\s+/g,' ');const n=norm(t);let i=-1;for(const w of words){i=n.indexOf(w);if(i>=0)break;}if(i<0)return '';const a=Math.max(0,i-40);return (a?'…':'')+t.slice(a,a+120)+(a+120<t.length?'…':'');}
function searchAll(q){
  const words=norm(q).split(/\s+/).filter(Boolean);if(!words.length)return[];
  const out=[];const seen=new Set();
  const push=(ref,score,snip)=>{if(seen.has(ref))return;const e=ent(ref);if(!e)return;seen.add(ref);out.push({e,score,snip});};
  if(!SRV.cache){SRV.cache=allEntities().map(e=>[e,norm(e.name+' '+(e.sub||''))]);}
  for(const [e,n] of SRV.cache){if(words.every(w=>n.includes(w)))push(e.ref,norm(e.name).startsWith(words[0])?0:1,'');}
  const texts=[];
  S.notes.forEach(x=>texts.push(['note:'+x.id,x.title+' '+(x.tags||[]).join(' ')+' '+x.text,x.text]));
  S.quests.forEach(x=>texts.push(['quest:'+x.id,x.title+' '+x.text,x.text]));
  S.lore.forEach(x=>texts.push(['lore:'+x.id,x.title+' '+x.place+' '+x.text,x.text]));
  S.videos.forEach(x=>texts.push(['video:'+x.id,x.title+' '+x.place+' '+x.notes,x.notes]));
  S.maps.forEach(m=>m.markers.forEach(k=>texts.push(['marker:'+k.id,k.title+' '+k.text,k.text])));
  S.npcs.forEach(x=>{if(x.actions||(x.desc&&!x.wiki))texts.push(['npc:'+x.id,x.name+' '+x.desc+' '+(x.actions||''),(x.actions||'')+' '+x.desc]);});
  S.customItems.forEach(x=>{if(x.source||x.desc)texts.push(['item:'+x.id,x.name+' '+(x.source||'')+' '+(x.desc||''),(x.source||'')+' '+(x.desc||'')]);});
  for(const [ref,hay,shown] of texts){if(seen.has(ref))continue;const n=norm(stripTok(hay));if(words.every(w=>n.includes(w)))push(ref,2,snippet(shown,words));}
  out.sort((a,b)=>a.score-b.score||ETORDER.indexOf(a.e.t)-ETORDER.indexOf(b.e.t)||a.e.name.localeCompare(b.e.name,'fr'));
  return out;
}

function gxAttach(){
  const cv=$('#gxcanvas');if(!cv)return;const pts=new Map();let drag=null,pinch=null;
  const world=(px,py)=>{const r=cv.getBoundingClientRect();return [GX.cam.x+(px-r.left-r.width/2)/GX.cam.z,GX.cam.y+(py-r.top-r.height/2)/GX.cam.z];};
  const hit=(px,py)=>{const [wx,wy]=world(px,py);let best=null,bd=1e9;for(const n of GX.nodes){const d=Math.hypot(n.x-wx,n.y-wy);const rr=Math.max(4,n.r*Math.sqrt(GX.cam.z))/GX.cam.z+4/GX.cam.z;if(d<rr&&d<bd){bd=d;best=n;}}return best;};
  cv.addEventListener('pointerdown',e=>{GX.lastI=performance.now();cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z:GX.cam.z};drag=null;return;}
    const n=hit(e.clientX,e.clientY);drag={n,sx:e.clientX,sy:e.clientY,cx:GX.cam.x,cy:GX.cam.y,moved:false};if(n){n.fixed=true;}});
  cv.addEventListener('pointermove',e=>{GX.lastI=performance.now();
    if(pts.has(e.pointerId))pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pinch&&pts.size===2){const [a,b]=[...pts.values()];GX.cam.z=clamp(pinch.z*Math.hypot(a[0]-b[0],a[1]-b[1])/pinch.d,.15,4);return;}
    if(!drag){const n=hit(e.clientX,e.clientY);if(n!==GX.hover){GX.hover=n;cv.style.cursor=n?'pointer':'grab';}return;}
    const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;
    if(drag.n){const [wx,wy]=world(e.clientX,e.clientY);drag.n.x=wx;drag.n.y=wy;GX.alpha=Math.max(GX.alpha,.15);}
    else if(drag.moved){GX.cam.x=drag.cx-dx/GX.cam.z;GX.cam.y=drag.cy-dy/GX.cam.z;cv.style.cursor='grabbing';}
  });
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!drag)return;const d=drag;drag=null;cv.style.cursor='grab';
    if(d.n&&!d.moved){d.n.fixed=false;gxSelect(d.n.ref,false);}else if(d.n){/* reste placé */}else if(!d.moved){gxSelect(null);}
  };
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('pointerleave',()=>{if(!drag)GX.hover=null;});
  cv.addEventListener('dblclick',e=>{const n=hit(e.clientX,e.clientY);if(n)openRef(n.ref);});
  cv.addEventListener('wheel',e=>{GX.lastI=performance.now();e.preventDefault();const [wx,wy]=world(e.clientX,e.clientY);const nz=clamp(GX.cam.z*(e.deltaY<0?1.15:1/1.15),.15,4);const r=cv.getBoundingClientRect();GX.cam.z=nz;GX.cam.x=wx-(e.clientX-r.left-r.width/2)/nz;GX.cam.y=wy-(e.clientY-r.top-r.height/2)/nz;},{passive:false});
}

function importMisc(r){
  const type=String(fget(r,'type')||'');const page=fget(r,'_pageName','name');const name=decEnt(String(fget(r,'name')||page));
  if(fget(r,'legacy'))return 'skip';
  const clean=t=>cleanWiki(cleanWikiHTML(t||''));
  if(MISC_ITEM[type]){
    const eff=clean(fget(r,'effect'));const des=clean(fget(r,'description'));
    const extra=[fget(r,'condition_duration')?'Durée : '+clean(fget(r,'condition_duration')):'',fget(r,'condition_save')?'Sauvegarde : '+clean(fget(r,'condition_save')):'',fget(r,'action_type')?'Utilisation : '+clean(fget(r,'action_type')):''].filter(Boolean).join('\n');
    const it={id:'m-'+slug(page),name,en:name,cat:MISC_ITEM[type],rarity:rarFR(fget(r,'rarity')),act:null,source:'',price:fget(r,'price')!=null?+String(fget(r,'price')).replace(/[^\d.]/g,'')||null:null,wiki:true,wtype:type,
      desc:[eff,des,extra].filter(Boolean).join('\n\n')};
    const h=(eff+' '+des).match(/(\d+d\d+(?:\s*\+\s*\d+)?)\s*(?:hit points|HP)/i);if(h)it.heal=h[1].replace(/\s+/g,'');
    const ic=fget(r,'icon'),im=fget(r,'image');if(ic)it.icon=ic;if(im)it.img=im;
    return mergeInto(S.customItems,it,['name','act','source','price','spell']);
  }
  if(MISC_LORE[type]){
    const id='bk-'+slug(page);const ex=S.lore.find(x=>x.id===id)||S.lore.find(x=>!x.wikiPage&&norm(x.title)===norm(name));
    const o={title:name,kind:MISC_LORE[type],author:clean(fget(r,'book_author'))||'',summary:[clean(fget(r,'description')),clean(fget(r,'quote'))].filter(Boolean).join('\n'),wikiPage:page,wiki:true,icon:fget(r,'icon')||null};
    if(ex){Object.assign(ex,{author:ex.author||o.author,summary:o.summary,wikiPage:page,wiki:true,icon:o.icon});return 'upd';}
    S.lore.push({id,title:o.title,kind:o.kind,act:'',place:'',text:'',items:[],npcs:[],spells:[],marker:null,updated:Date.now(),...o});return 'new';
  }

}

async function importBookTexts(){

  let n=0,f=0,k=0;
  for(const b of (j.books||[])){
    const id='bk-'+slug(b.page);let x=S.lore.find(l=>l.id===id)||S.lore.find(l=>l.wikiPage===b.page)||S.lore.find(l=>!l.wikiPage&&norm(l.title)===norm(decEnt(b.name||b.page)));

    if(b.text&&!String(x.text||'').trim()){x.text=b.text;f++;}else if(b.text)k++;

  Store.touch('lore');if(cur==='biblio')renderBiblio();

}

function navTo(dir){
  const cards=S.board.cards;if(!cards.length)return;

  if(!c0){next=[...cards].sort((a,b)=>a.y-b.y||a.x-b.x)[0];}
  else{const cx=c0.x+c0.w/2,cy=c0.y+c0.h/2;let best=1e12;
    for(const c of cards){if(c===c0)continue;const dx=c.x+c.w/2-cx,dy=c.y+c.h/2-cy;
      const ok=dir==='ArrowRight'?dx>10:dir==='ArrowLeft'?dx<-10:dir==='ArrowDown'?dy>10:dy<-10;if(!ok)continue;
      const main=dir==='ArrowRight'||dir==='ArrowLeft'?Math.abs(dx):Math.abs(dy),side=dir==='ArrowRight'||dir==='ArrowLeft'?Math.abs(dy):Math.abs(dx);
      const score=main+side*2.2;if(score<best){best=score;next=c;}}}
  if(!next)return;setSingle(next.id);if(next.type==='sticky'||next.type==='text'){BSEL=next.id;renderCtx();}
  const wrap=$('#boardwrap');const z=S.board.z||1;if(wrap){const l=next.x*z,t=next.y*z,r=l+next.w*z,bt=t+next.h*z;
    if(l<wrap.scrollLeft+20||r>wrap.scrollLeft+wrap.clientWidth-20)wrap.scrollTo({left:Math.max(0,l-wrap.clientWidth/2+next.w*z/2),behavior:'smooth'});
    if(t<wrap.scrollTop+20||bt>wrap.scrollTop+wrap.clientHeight-20)wrap.scrollTo({top:Math.max(0,t-wrap.clientHeight/2+next.h*z/2),behavior:'smooth'});}
}

GH.remoteApp=0;
{const fl=ghFetchLatest;ghFetchLatest=async function(c){const o=await fl(c);if(o&&o.app)GH.remoteApp=+o.app;return o;};}
{const sv=ghSave;ghSave=async function(silent){
  if(GH.remoteApp&&GH.remoteApp>+APP_VERSION){const m=`Cette page est une ancienne version (v${APP_VERSION}) alors que ta sauvegarde a été faite avec la v${GH.remoteApp}. Recharge la page (Ctrl+F5) avant d’enregistrer, sinon tu risques d’effacer des données.`;if(!silent)alert(m);setSync('err');syncText('Version périmée : recharge la page');GH.log('Envoi bloqué : page en v'+APP_VERSION+', sauvegarde en v'+GH.remoteApp+'.');return;}
  return sv(silent);};}
/* ---------- nouvelle version disponible ? ---------- */
async function checkNewVersion(){
  if(!STANDALONE||!/^https?:/.test(location.protocol))return;
  try{const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;const t=await r.text();const m=t.match(/const APP_VERSION='(\d+)'/g);if(!m)return;const v=Math.max(...m.map(x=>+x.match(/\d+/)[0]));
    if(v>+APP_VERSION&&!$('#newver')){document.body.insertAdjacentHTML('beforeend',`<div id="newver" class="newver" role="alert">Une nouvelle version du codex est disponible (v${v}). <button class="small primary" onclick="location.reload()">Recharger</button></div>`);GH.remoteApp=Math.max(GH.remoteApp,v);}}catch(e){}
}
setTimeout(checkNewVersion,4000);setInterval(checkNewVersion,10*60*1000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkNewVersion();});

/* ---------- copies de secours locales avant toute opération risquée ---------- */
async function safetySnap(reason){
  if(!STANDALONE)return;
  try{const o={codex:'bg3',snap:true,reason,date:new Date().toISOString(),app:+APP_VERSION};for(const k of Store.keys)o[k]=clone(Store.pack(k));
    await IDB.set('snap:'+Date.now(),o);const keys=(await IDB.keys()).filter(k=>String(k).startsWith('snap:')).sort();
    for(const k of keys.slice(0,Math.max(0,keys.length-10)))await IDB.req('readwrite',s=>s.delete(k));}catch(e){console.warn('copie de secours',e);}
}
{const ab=applyBackup;applyBackup=async function(o,merge){await safetySnap(merge?'avant une fusion':'avant un chargement');return ab(o,merge);};}
{const del=ACT['sheet-del'];ACT['sheet-del']=t=>{safetySnap('avant suppression d’un plan').then(()=>del(t));};}

/* ---------- extraire les plans contenus dans une sauvegarde ---------- */
function plansOf(o){
  const b=o&&o.board;if(!b)return [];const out=[];
  const clean=x=>{const y=clone(x||{});delete y.sheets;return {cards:y.cards||[],strokes:y.strokes||[],links:y.links||[],z:y.z||1,seeded:true};};
  if(b.sheets&&Array.isArray(b.sheets.list)){for(const t of b.sheets.list){const data=t.id===b.sheets.cur?b:(b.sheets.store||{})[t.id];if(data)out.push({name:t.name,data:clean(data)});}}
  else out.push({name:'Tableau',data:clean(b)});
  return out.filter(p=>p.data.cards.length||p.data.strokes.length);
}
function planSummary(p){const names=p.data.cards.map(c=>c.type==='sticky'||c.type==='text'?(c.title||stripTok(String(c.html||'').replace(/<[^>]+>/g,' ')).trim().slice(0,24)):(ent(c.ref)||{}).name).filter(Boolean);return `${p.data.cards.length} carte${p.data.cards.length>1?'s':''}${p.data.strokes.length?', '+p.data.strokes.length+' dessin'+(p.data.strokes.length>1?'s':''):''}${names.length?' : '+names.slice(0,5).map(esc).join(', ')+(names.length>5?'…':''):''}`;}
let RECOV=[];
function recoverPlan(i,label){
  const p=RECOV[i];if(!p)return;const id=uid();
  S.sheets.list.push({id,name:`${p.name} (récupéré ${label})`});S.sheets.store[id]=clone(p.data);Store.touch('board');
  toast(`Plan « ${p.name} » récupéré dans un nouvel onglet. Rien d’autre n’a été modifié.`);
  if(cur==='accueil'){const bar=$('.sheettabs');if(bar)bar.outerHTML=sheetTabsHTML();}
}
function plansListHTML(o,label){
  const ps=plansOf(o);const base=RECOV.length;RECOV.push(...ps);
  return ps.length?ps.map((p,i)=>`<div class="mrow"><b>${esc(p.name)}</b><span class="small muted">${planSummary(p)}</span><button class="small primary" data-act="recov-plan" data-i="${base+i}" data-l="${esc(label)}">↩ Récupérer comme nouvel onglet</button></div>`).join(''):'<p class="small muted">Aucun plan avec du contenu dans cette version.</p>';
}
ACT['recov-plan']=t=>recoverPlan(+t.dataset.i,t.dataset.l);

/* ---------- fenêtre : historique des sauvegardes ---------- */
async function historyDialog(){
  RECOV=[];
  openDlg('Historique et récupération',`<p class="small muted">Retrouve un plan perdu dans une ancienne sauvegarde. Il revient dans un <b>nouvel onglet</b> : rien de ce que tu as aujourd’hui n’est effacé.</p>
    <h3>Sur GitHub</h3><div id="hist-gh"><p class="small muted">Chargement de l’historique…</p></div>
    <h3 style="margin-top:1rem">Copies de secours sur cet appareil</h3><div id="hist-local"><p class="small muted">Chargement…</p></div>
    <div id="hist-view" style="margin-top:1rem"></div>`,{wide:true});
  const c=GH.cfg();
  if(!STANDALONE||!c||!c.token){$('#hist-gh').innerHTML='<p class="small muted">La synchronisation GitHub n’est pas réglée sur cet appareil (⚙).</p>';}
  else{
    try{const r=await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/commits?path=${encodeURIComponent(c.path)}&sha=${encodeURIComponent(c.branch)}&per_page=40`,{headers:GH.headers(c),cache:'no-store'});
      const j=await r.json();if(!r.ok)throw new Error(ghErr(r,j));
      $('#hist-gh').innerHTML=j.length?`<div class="mlist">${j.map(x=>`<div class="mrow"><span>${esc(hhmm(x.commit.author.date))}</span><span class="small muted">${esc(String(x.commit.message||'').replace(/^Codex : sauvegarde /,''))}</span><button class="small" data-act="hist-open" data-sha="${esc(x.sha)}" data-l="${esc(hhmm(x.commit.author.date))}">Voir les plans</button></div>`).join('')}</div>`:'<p class="small muted">Aucune sauvegarde trouvée.</p>';
    }catch(e){$('#hist-gh').innerHTML=`<p class="small" style="color:var(--danger)">${esc(e.message||'Historique indisponible')}</p>`;}
  }
  if(STANDALONE){try{const keys=(await IDB.keys()).filter(k=>String(k).startsWith('snap:')).sort().reverse();
    $('#hist-local').innerHTML=keys.length?`<div class="mlist">${(await Promise.all(keys.map(k=>IDB.get(k)))).map((o,i)=>`<div class="mrow"><span>${esc(hhmm(o.date))}</span><span class="small muted">${esc(o.reason||'')}</span><button class="small" data-act="hist-local" data-k="${esc(keys[i])}" data-l="${esc(hhmm(o.date))}">Voir les plans</button></div>`).join('')}</div>`:'<p class="small muted">Pas encore de copie de secours. Une copie est faite automatiquement avant chaque chargement ou suppression de plan.</p>';}catch(e){$('#hist-local').innerHTML='<p class="small muted">Indisponible.</p>';}}
  else $('#hist-local').innerHTML='<p class="small muted">Disponible sur ta page GitHub.</p>';
}
ACT['hist-open']=async t=>{const c=GH.cfg();const v=$('#hist-view');v.innerHTML='<p class="small muted">Chargement de cette version…</p>';v.scrollIntoView({block:'nearest'});
  try{const r=await fetch(GH.url(c)+'?ref='+encodeURIComponent(t.dataset.sha),{headers:GH.headers(c,'application/vnd.github.raw+json'),cache:'no-store'});if(!r.ok)throw new Error('Version introuvable');const o=JSON.parse(await r.text());
    v.innerHTML=`<h3>Plans de la sauvegarde du ${esc(t.dataset.l)}</h3>${plansListHTML(o,t.dataset.l)}`;}catch(e){v.innerHTML=`<p class="small" style="color:var(--danger)">${esc(e.message)}</p>`;}};
ACT['hist-local']=async t=>{const o=await IDB.get(t.dataset.k);const v=$('#hist-view');v.innerHTML=o?`<h3>Plans de la copie du ${esc(t.dataset.l)}</h3>${plansListHTML(o,t.dataset.l)}`:'<p class="small muted">Copie introuvable.</p>';v.scrollIntoView({block:'nearest'});};
ACT['history']=()=>historyDialog();
/* accès : bouton dans ⚙ et à côté des onglets du tableau */
{const g=ghSettings;ghSettings=function(){g();const f=$('#ghform');if(f)f.insertAdjacentHTML('beforebegin','<div class="row" style="margin:.3rem 0"><button data-act="history">🕘 Historique et récupération des plans</button></div>');};}
{const st=sheetTabsHTML;sheetTabsHTML=function(){return st().replace('<button class="stadd" data-act="sheet-add"','<button class="stadd" data-act="history" title="Historique : récupérer un plan perdu" aria-label="Historique des plans">🕘</button><button class="stadd" data-act="sheet-add"');};}
