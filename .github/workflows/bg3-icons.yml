name: Icônes BG3
on:
  workflow_dispatch:
    inputs:
      creatures:
        description: "Inclure aussi les portraits des créatures (plus long)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: bg3-icons
  cancel-in-progress: false
jobs:
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: Télécharger les icônes (tranquillement)
        run: python scripts/bg3_icons.py
        timeout-minutes: 300
        continue-on-error: true
        env:
          WITH_CREATURES: ${{ inputs.creatures }}
      - name: Enregistrer les icônes dans le dépôt (même si c'est incomplet)
        if: always()
        run: |
          git config user.name "codex-bot"
          git config user.email "codex-bot@users.noreply.github.com"
          git add icons || true
          git diff --cached --quiet || git commit -m "Icônes BG3 depuis bg3.wiki"
          git pull --rebase --autostash || true
          git push
