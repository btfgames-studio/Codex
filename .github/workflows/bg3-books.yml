name: Livres BG3
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bg3-books
  cancel-in-progress: false
jobs:
  books:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Récupérer les textes des livres (tranquillement)
        run: python -u scripts/bg3_books.py
        timeout-minutes: 100
        continue-on-error: true
      - name: Enregistrer le fichier dans le dépôt (même si c'est incomplet)
        if: always()
        run: |
          git config user.name "codex-bot"
          git config user.email "codex-bot@users.noreply.github.com"
          git add data || true
          git diff --cached --quiet || git commit -m "Textes des livres BG3 depuis bg3.wiki"
          git pull --rebase --autostash || true
          git push
